[mod-setting-name]
arrow-style=Styl strzałki taśmy
tier-style=Odstępy strzałek taśmy
stripe-style=Styl pasów na taśmie
rail-style=Styl krawędź taśmy

arrow-glow=Świecące strzałki
stripe-glow=Świecące paski
rail-glow=Świecące krawędzie

rb-visualization=Wskaźnik kierunku ruchu taśmy

[mod-setting-description]
arrow-style=Zmienia styl kolorowych strzałek naniesionych na taśmociągi lub decyduje o tym, czy strzałki w ogóle mają być widoczne. (Domyślnie: Zwykłe strzałki)
tier-style=Zmienia odstępy między strzałkami na taśmociągach oraz decyduje, czy mają one zależeć od poziomu taśmociągu, czy być jednakowe dla wszystkich typów. (Domyślnie: Odstępy zależne od poziomu)
stripe-style=Zmienia styl kolorowego paska naniesionego na taśmociągi. Może on nakładać się na strzałki. (Domyślnie: Brak paska)
rail-style=Zmienia styl elementów mechanicznych znajdujących się po bokach taśmociągów. (Domyślnie: Standardowe barierki)

arrow-glow=Po włączeniu strzałki na wierzchu taśmy będą świecić w ciemności.
stripe-glow=Po włączeniu namalowane pasy na wierzchu taśmy będą świecić w ciemności.
rail-glow=Po włączeniu krawędzie taśmy będą świecić w ciemności. Działa tylko przy włączonej opcji „kolorowe krawędzie”!

rb-visualization=Jeśli opcja jest włączona, mała strzałka wskazuje kierunek ustawienia taśmociągu trzymanego w kursorze, co ułatwia budowanie.

