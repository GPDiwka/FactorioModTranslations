[string-mod-setting-description]
arrow-style-no-arrows=Gładki gumowy pas. Brak strzałek!
arrow-style-arrow=Strzałki w stylu podstawowym (vanilla) rozmieszczone na pasach.
arrow-style-arrow-thick=Grubsze strzałki, zajmujące środkową część segmentu przenośnika.
arrow-style-arrow-long=Podobnie jak w przypadku grubszych strzałek, z tą różnicą, że szybsze pasy mają 2 lub 4 strzałki ułożone jedna po drugiej, tworząc przerywaną linię.

tier-style-tier-based=Rozmieszczenie strzałek na taśmach zależy od ich poziomu, tak jak w podstawowej wersji gry.\nTaśmy o przepustowości <30 el./s mają standardowe odstępy między strzałkami.\nTaśmy o przepustowości >=30 el./s mają odstępy typowe dla szybkich taśm.\nTaśmy o przepustowości >=60 el./s mają odstępy typowe dla taśm turbo.
tier-style-single=Strzałki na wszystkich taśmach są rozmieszczone blisko siebie, tak jak na zwykłych taśmociągach.
tier-style-doubled=Strzałki na wszystkich taśmach są bardziej rozstawione, tak jak na szybkich lub ekspresowych taśmociągach.
tier-style-quadrupled=Strzałki na wszystkich taśmach są rozmieszczone w dużych odstępach, tak jak na taśmociągach turbo.

stripe-style-no-stripe=Niepomalowany czarny gumowy pas.
stripe-style-stripe-thick=Gruby, kolorowy pas biegnący środkiem taśmy. Inspiracja: pasy bez strzałek (Arrowless Belts).\nStrzałki są wyświetlane w odwróconej orientacji.
stripe-style-stripe-thin=Cienka, kolorowa linia biegnąca środkiem taśmy. Inspiracja: pasy bez strzałek (Arrowless Belts).
stripe-style-stripe-side=Kolorowe pasy po bokach taśmy.
stripe-style-full-paint=Cała taśma pomalowana na wyrazisty kolor.\nStrzałki są wyświetlane w odwróconej orientacji.
stripe-style-prismatic=Cała taśma zabarwiona na ciemny kolor. Inspiracja: pasy słupkowe (Prismatic Belts).

rail-style-vanilla=Metalowy mechanizm w stylu waniliowym dla wszystkich taśm.
rail-style-ir3-alt=Mechanizm każdej taśmy ma charakterystyczny metaliczny odcień, zależny od metali z moda IR3 i/lub receptury wytwarzania.
rail-style-colored=Boczne krawędzie każdej taśmy są pokolorowane zgodnie z jej poziomem. Świetnie komponuje się ze stylem strzałek „bez strzałek”!
