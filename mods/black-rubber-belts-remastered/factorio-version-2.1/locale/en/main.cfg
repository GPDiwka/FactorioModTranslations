[string-mod-setting-description]
arrow-style-no-arrows=Smooth rubber belt. No arrows!
arrow-style-arrow=Vanilla style arrows dot the belts.
arrow-style-arrow-thick=Thicker arrows, which cover the middle section of an entire conveyor plate.
arrow-style-arrow-long=Similar to thicker arrows, except faster belts get 2 or 4 arrows in a successive manner, creating a dotted line.

tier-style-tier-based=Arrows are spread along belts depending on each belt's tier, just like in the base game.\n<30 items/s belts get regular belt spacing.\n>=30 items/s belts get fast belt spacing.\n>=60 items/s belts get turbo belt spacing.
tier-style-single=Arrows are spread close to each other for all belts, like regular vanilla transport belts.
tier-style-doubled=Arrows are spread out on all belts, like fast or express transport belts.
tier-style-quadrupled=Arrows are very far apart on all belts, like turbo transport belts.

stripe-style-no-stripe=Unpainted black rubber belt.
stripe-style-stripe-thick=A thick colored stripe right in the middle of the belt. Inspired by Arrowless Belts.\nArrows are displayed inverted.
stripe-style-stripe-thin=A thin colored line right in the middle of the belt. Inspired by Arrowless Belts.
stripe-style-stripe-side=Colored stripes on the sides of the belt.
stripe-style-full-paint=The entire belt is painted with a vibrant color.\nArrows are displayed inverted.
stripe-style-prismatic=The entire belt is tinted with a dark color. Inspired by Prismatic Belts.

rail-style-vanilla=Vanilla style metallic mechanism for all belts.
rail-style-ir3-alt=Each belt's mechanism has a specific metallic tint based on IR3 metals and/or its crafting recipe.
rail-style-colored=Each belt's side rails are colored based on their tier. Pairs well with the "no arrows" arrow style!
