[mod-setting-name]
arrow-style=Belt arrow style
tier-style=Belt arrow spacing
stripe-style=Belt stripe style
rail-style=Belt railing style

arrow-glow=Glowing arrows
stripe-glow=Glowing stripes
rail-glow=Glowing rails

rb-visualization=Belt direction indicator

[mod-setting-description]
arrow-style=Changes the style of the colored arrows added onto the belts, or if there are arrows at all. (Default: Regular arrows)
tier-style=Changes how far apart arrows should be spaced out on belts, and whether it should depend on the tier of the belt or be the same accross all belts. (Default: Tier-based spacing)
stripe-style=Changes the style of the colored stripe painted onto the belts. Can overlap with arrows. (Default: No stripe)
rail-style=Changes the style of the mechanical parts on the sides of the belts. (Default: Vanilla rails)

arrow-glow=When enabled, arrows on top of the belt will glow in the dark.
stripe-glow=When enabled, painted stripes on top of the belt will glow in the dark.
rail-glow=When enabled, the belt rails on the side of belts will glow in the dark. Only works with "colored rails" active!

rb-visualization=If enabled, a small arrow will point which direction the transport belt held in the cursor is facing, for ease of building.

