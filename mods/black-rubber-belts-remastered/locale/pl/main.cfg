[mod-setting-name]
arrow-style=Styl strzałek taśmociągu
rail-style=Styl barierek taśmociągu
arrow-glow=Świecące strzałki
rail-glow=Świecące barierki
thick-turbo-arrows=Grubsze strzałki dla taśmociągów turbo

[mod-setting-description]
arrow-style=Zmienia styl kolorowych strzałek umieszczonych na taśmach lub decyduje o ich obecności. (Domyślnie: odstępy zależne od poziomu)
rail-style=Zmienia styl elementów mechanicznych znajdujących się po bokach taśm. (Domyślnie: standardowe szyny)
arrow-glow=Po włączeniu strzałki na taśmie (lub podobne wzory) będą świecić w ciemności.
rail-glow=Po włączeniu szyny boczne taśm będą świecić w ciemności. Działa tylko przy włączonej opcji „kolorowe szyny”!
thick-turbo-arrows=Po włączeniu strzałki na szybkich taśmach, wykorzystujące animacje taśm turbo, stają się grubsze. Działa tylko przy włączonych strzałkach!

