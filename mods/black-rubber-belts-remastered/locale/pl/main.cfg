arrow-style-arrow-quadrupled=[img=turbo-belt] Szeroko rozstawione strzałki
arrow-style-no-arrows=[img=no-arrows] Brak strzałek
arrow-style-line-thick=[img=line-thick] Gruby pas
arrow-style-line-thin=[img=line-thin] Cienka linia
