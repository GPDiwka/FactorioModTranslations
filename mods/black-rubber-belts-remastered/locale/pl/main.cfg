[string-mod-setting-description]
arrow-style-arrows=Strzałki rozmieszczone na taśmie w odstępach zależnych od jej poziomu.
arrow-style-arrow=Strzałki rozmieszczone gęsto na wszystkich taśmach (z wyjątkiem taśm typu turbo), podobnie jak na zwykłych taśmociągach.
arrow-style-arrow-doubled=Strzałki rozmieszczone w regularnych odstępach na wszystkich taśmach (z wyjątkiem taśm typu turbo), podobnie jak na szybkich taśmociągach.
arrow-style-no-arrows=Gładka, gumowa taśma. Brak strzałek!
arrow-style-line-thick=Gruby, kolorowy pas biegnący środkiem taśmy zastępuje strzałki.
arrow-style-line-thin=Cienka, kolorowa linia biegnąca środkiem taśmy zastępuje strzałki.
arrow-style-line-side=Kolorowe pasy na krawędziach taśmy zastępują strzałki.

rail-style-vanilla=Metalowy mechanizm w stylu podstawowej wersji gry dla wszystkich taśmociągów.
rail-style-ir3-alt=Mechanizm każdego taśmociągu ma charakterystyczny metaliczny odcień, zależny od metali z moda IR3 i/lub receptury wytwarzania.
rail-style-colored=Boczne szyny każdego taśmociągu są pokolorowane zgodnie z jego poziomem. Świetnie komponuje się ze stylem strzałek „bez strzałek”!
