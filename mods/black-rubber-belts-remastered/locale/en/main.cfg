[mod-setting-name]
arrow-style=Belt arrow style
rail-style=Belt railing style
arrow-glow=Glowing arrows
rail-glow=Glowing rails
thick-turbo-arrows=Thicker arrows for turbo belts

[mod-setting-description]
arrow-style=Changes the style of the colored arrows added onto of the belts, or if there are arrows at all. (Default: Tier-based spacing)
rail-style=Changes the style of the mechanical parts on the sides of the belts. (Default: Vanilla rails)
arrow-glow=When enabled, arrows on top of the belt (or similar patterns) will glow in the dark
rail-glow=When enabled, the belt rails on the side of belts will glow in the dark. Only works with "colored rails" active!
thick-turbo-arrows=When enabled, the arrows of fast belts that use the turbo belt's animations are made thicker. Only works with arrows active!

[string-mod-setting]
arrow-style-arrows=[img=default-belt] Arrows (tier-based)
arrow-style-arrow=[img=narrow-belt] Narrow arrows
arrow-style-arrow-doubled=[img=red-belt] Spaced arrows
arrow-style-arrow-quadrupled=[img=turbo-belt] Extra spaced arrows
arrow-style-no-arrows=[img=no-arrows] No arrows
arrow-style-line-thick=[img=line-thick] Thick stripe
arrow-style-line-thin=[img=line-thin] Thin line
arrow-style-line-side=[img=line-side] Side stripes

rail-style-vanilla=[img=item.iron-gear-wheel] Vanilla rails
rail-style-ir3-alt=[img=alt-bases] IR3 material rails
rail-style-colored=[img=colored-rails] Colored rails

[string-mod-setting-description]
arrow-style-arrows=Arrows dot the belt, spaced out depending on each tier of belt.
arrow-style-arrow=Arrows are spaced tightly together for all belts (except for turbo-style belts), like regular transport belts.
arrow-style-arrow-doubled=Arrows are spaced regularly for all belts (except for turbo-style belts), like fast transport belts.
arrow-style-no-arrows=Smooth rubber belt. No arrows!
arrow-style-line-thick=A thick colored stripe right in the middle of the belt replaces arrows.
arrow-style-line-thin=A thin colored line right in the middle of the belt replaces arrows.
arrow-style-line-side=Colored stripes on the sides of the belt replaces arrows.

rail-style-vanilla=Vanilla style metallic mechanism for all belts.
rail-style-ir3-alt=Each belt's mechanism has a specific metallic tint based on IR3 metals and/or its crafting recipe.
rail-style-colored=Each belt's side rails are colored based on their tier. Pairs well with the "no arrows" arrow style!
