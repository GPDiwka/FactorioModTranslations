[entity-description]
ric-process-machine-placement-contract=Industrial Alchemy process equipment with an audited footprint and pipe-layout contract.
ric-real-resource=A dedicated Industrial Alchemy real-ore or industrial-mineral deposit.
ric-gas-resource=A dedicated Industrial Alchemy natural-gas or sour-gas fluid resource.
ric-ore-sorter=Dry ore preparation machine for sorting vanilla ore and stone into real ores, minerals, and early concentrates.

ric-crusher=Burner bootstrap machine for turning real ores, stone, and coal into crushed feedstock. Build this first.
ric-ore-washer=Wet processing machine for washing crushed ores and fines into cleaner concentrates plus tailings and wastewater.
ric-flotation-cell=Green-science sulfide upgrade for concentrating copper fines and froth before later hydrometallurgy.
ric-coke-oven=Turns coal or crushed coal into coke, coal tar, and fuel-gas byproducts for the first metallurgy and petrochemical loops.
ric-blast-furnace=Primary early metallurgy furnace for pig iron, copper matte, slag, and steelmaking feedstock.
ric-sintering-plant=Prepares fine iron concentrate into sinter so the blast furnace has a proper ferrous feed.
ric-casting-machine=Casts pig iron and blister copper into canonical plates during the early industrial metal route.
ric-rolling-mill=Shapes steel billets and later metal slabs/sheets into usable plates and formed industrial stock.
ric-waste-treatment-plant=Handles tailings, slag, sour water, acidic wastewater, and neutralised waste streams so early industry does not deadlock.
ric-chemical-reactor=General-purpose chemistry machine for early inorganic chemistry, neutralisation, acid work, and bridge recipes.
ric-air-separator=Splits air into oxygen and nitrogen for metallurgy, sulfur processing, and later high-pressure chemistry.
ric-electrolyzer=Electrochemical machine for water, brine, chlor-alkali, fluorine, and later advanced electrolytic routes.
ric-roaster=Oxidising furnace for sulfide concentrates and mineral chemistry that need gas/acid byproduct handling.
ric-distillation-column=Early fractionation machine for crude oil, coal tar, naphtha, fuel gas, and heavy-residue processing.
ric-electrowinning-cell=Hydrometallurgy machine for recovering metal cathodes from sulfate/leachate solutions.
ric-vacuum-distillation-column=Advanced refining column for heavy residue and vacuum fractionation after basic distillation is established.
ric-delayed-coker=Advanced refinery unit for cracking vacuum residue into petroleum coke and lighter refinery streams.
ric-hydrotreater=Advanced pressure reactor for sulfur removal and cleaner refinery fractions.
ric-catalytic-reformer=Advanced catalytic refinery unit for reformate and aromatic chemistry.
ric-steam-cracker=Advanced petrochemical machine for cracking gas oil and light hydrocarbons into polymer feedstocks.
ric-cleanroom-assembler=Controlled-environment assembler for circuit boards, semiconductors, wafers, and precision electronics.
ric-catalytic-reactor=Catalyst-driven process machine for ammonia, methanol, peroxide, reforming, and specialty chemistry.
ric-high-pressure-reactor=Pressure-rated process machine for high-pressure synthesis and hydrogenation routes.
ric-advanced-distillation-column=High-throughput separation column for advanced chemical and refinery fractions.
ric-advanced-electrochemical-cell=Advanced electrochemical machine for high-tier electrolysis and electrorefining routes.

ric-limestone=Mineable limestone deposit. Required early for flux and crushed limestone chains.
ric-quartz=Mineable quartz deposit for silica and electronics-material chains.
ric-gypsum=Mineable gypsum deposit for sulfate, construction, and byproduct-utilisation chains.
ric-rock-salt=Mineable rock salt deposit for chlorine, brine, sodium, and basic inorganic chemistry.
ric-graphite=Mineable graphite deposit for carbon, refractory, and electronics-material chains.
ric-bauxite=Mineable bauxite deposit for aluminium processing.
ric-borax=Mineable borax deposit for glass, ceramics, and specialty chemistry.
ric-fluorite=Mineable fluorite deposit for flux and specialist acid chemistry.
ric-apatite=Mineable apatite deposit for phosphate and fertilizer chemistry.
ric-sylvite=Mineable sylvite deposit for potash and fertilizer chemistry.
ric-kaolin=Mineable kaolin deposit for ceramics and insulating materials.
ric-baghouse-filter=Removes entrained fly ash and metallurgical dust from cooled industrial flue gas before wet scrubbing.
ric-wet-scrubber=Uses lime slurry and replaceable sorbent media to remove sulfur-bearing contaminants from particulate-controlled flue gas.
ric-primary-clarifier=Settles suspended solids from industrial wastewater into a pumpable sludge underflow and a treated liquid overflow.
ric-sludge-filter-press=Mechanically dewaters sludge slurry into filter cake while returning clarified liquid to the treatment loop.

