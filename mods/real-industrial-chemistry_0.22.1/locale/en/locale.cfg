ric-ore-processing-1=First RIC process milestone: ore sorter, machine frames, limestone flux, dry concentration, primitive plate bridges, and tailings relief.
ric-ore-processing=Unlocks the ore sorter, basic raw-ore sorting, graded screening, dry concentration, and machine frames.
ric-coking=Opens coke ovens, coke, coal tar, fuel gas, and industrial carbon for metallurgy and the petrochemical bootstrap.
ric-blast-furnace=Opens blast furnaces, sintering, casting, pig iron, copper matte, blister copper, and first slag cleanup.
ric-steel-processing=Opens the rolling mill and billet route. This replaces the vanilla steel shortcut with shaped industrial steel.
ric-basic-chemistry=Adds basic process chemistry machines and air separation after the steel route is stable.
ric-electrolysis=Unlocks electrolyzers and water electrolysis for hydrogen and oxygen.
ric-chlor-alkali-processing=Turns brine into chlorine, sodium hydroxide, and hydrochloric acid.
ric-sulfur-processing=Connects copper roasting and hydrogen sulfide combustion to sulfur dioxide production.
ric-ammonia-processing=Combines nitrogen and hydrogen into ammonia, then oxidizes it into nitric acid.
ric-oil-processing=Begins tar and crude fractionation without requiring chemical science first.
ric-plastics=Turns petrochemical feedstocks into canonical plastic bars for circuits and chemical science.
ric-lubricant=Processes heavy residue into lubricant and bitumen for the first heavy-oil side-stream outlet.
chemical-science-pack=Completes the green-to-blue science bridge once engines, batteries, advanced circuits, plastic, sulfur, sulfuric acid, and waste treatment are stable.
advanced-circuit=Opens the circuit-substrate advanced-circuit bridge after board fabrication, plastics, batteries, and sulfuric-acid production are established.
ric-fertilizer-chemistry=Uses ammonia, nitric acid, phosphoric acid, carbon dioxide, and potash to make fertilizer intermediates and ammonium nitrate explosives feedstock.
ric-syngas-chemistry=Expands fuel gas into syngas, methanol, formaldehyde, hydrogen, methane, carbon monoxide, and the first light solvent stream.
ric-olefins-and-aromatics=Cracks naphtha into olefins and extracts aromatics for phenol, acetone, styrene, and resin chemistry.
ric-rubber-and-resins=Produces phenolic resin, bisphenol A, epoxy resin, synthetic rubber, and polypropylene from the expanded petrochemical chain.
ric-chlorinated-polymers=Uses ethylene and chlorine chemistry to produce vinyl chloride and PVC.
ric-fluorine-chemistry=Turns fluorite into hydrofluoric acid, sodium fluoride, aluminium fluoride, and cryolite.
ric-aluminium-smelting=Uses the Hall-Héroult process to turn alumina into aluminium ingots, plates, and cable.
ric-light-alloys=Uses aluminium, nickel, zinc, silicon carbide, rubber, and epoxy to build light structural materials and low-density structures.
ric-lead-tin-metallurgy=Processes galena and cassiterite into lead, tin, and solder.
ric-lead-acid-storage=Uses lead plates and sulfuric acid to build lead-acid accumulators.
ric-alloy-steel-processing=Turns chromite, pyrolusite, nickel, and steel into ferroalloys and stainless steel.
ric-corrosion-resistant-components=Uses stainless steel and PVC to make stainless gears and corrosion-resistant pipe.
ric-magnesium-processing=Recovers magnesium chloride from brine and electrolyses it into magnesium for titanium reduction.
ric-titanium-metallurgy=Processes ilmenite and rutile into titanium dioxide, titanium tetrachloride, titanium sponge, and titanium plate.
ric-lithium-chemistry=Processes spodumene into lithium carbonate, lithium hydroxide, lithium fluoride, and battery electrolyte.
ric-titanium-alloys=Combines titanium, aluminium, molybdenum, and nickel into advanced titanium alloy.
ric-advanced-battery-chemistry=Builds battery tabs, lithium-ion cells, and lithium-ion battery outputs.
ric-natural-gas-processing=Processes natural gas into methane, light alkanes, syngas, hydrogen, and olefin feedstocks.
ric-sour-gas-processing=Sweetens sour gas and recovers sulfur through hydrogen sulfide oxidation and Claus sulfur recovery.
ric-wet-ore-processing=Adds ore washing and wastewater/tailings pressure once green science can support larger processing loops.
ric-waste-treatment=Adds the waste treatment plant and early neutralisation recipes so washing, slag, tailings, and sour/acidic water have outlets.
ric-sulfur-recovery=Recovers elemental sulfur from sulfur dioxide for batteries, advanced circuits, explosives, and chemical science.
ric-sulfuric-acid-production=Oxidises sulfur dioxide and hydrates sulfur trioxide into sulfuric acid for batteries and chemical industry.
ric-naphtha-cracking=Cracks naphtha into polymer feedstocks and fuel gas for the plastics bridge.
automation=Unlocks the first assembler. In RIC this is still the handoff from burner bootstrap to repeatable production.
battery=Builds batteries from RIC-produced plastic and sulfuric acid.
ric-component-logistics=Early logistics split tuned to be reachable soon after Automation.
ric-fast-logistics=Fast logistics are tuned as a steel/component upgrade after industrial steel.
ric-mechanical-engines=Mechanical engines are tuned to arrive after industrial steel without dragging the player into chemical science first.
ric-electric-engines=Electric engines are tuned as a chemical-science-era upgrade once lubricant and machine frames are established.
ric-basic-modules=First modules are tuned as a post-advanced-circuit upgrade with a lighter component tax.
ric-sulfide-flotation=Adds flotation for copper fines and froth cleaning after wet ore processing and basic chemistry are established.
ric-refinery-fractionation=Adds vacuum distillation, delayed coking, sour-water stripping, offgas recovery, offgas reforming, petroleum coke, asphalt binder, and RIC solid-fuel routes.
ric-petrochemical-cracking-reforming=Deepens petrochemistry with gas-oil hydrotreating, steam cracking, pyrolysis gasoline cleanup, reformate/aromatics extraction, and alkylate fuel blending.
ric-integrated-steelmaking=Adds direct-reduced iron, oxygen steelmaking, steel slabs, sheet rolling, and formed steel frames for the industrial metallurgy layer.
ric-copper-fire-refining=Adds flash smelting, blister copper fire-refining, fire-refined anode casting, and rolled copper sheet.
ric-light-metal-forming=Adds aluminium billets, aluminium sheet, aluminium extrusion, and light alloy structural panels.
ric-stainless-forming=Adds ferroalloy charges, stainless billets, stainless sheet rolling, and refractory linings for advanced process equipment.
ric-titanium-forming=Adds titanium billets and titanium sheet as a formed-product layer for advanced equipment and late infrastructure.
ric-industrial-fuels-and-emissions=Process coal and coke into explicit fuel carriers, prepare scrubber sorbents, and expose dirty flue gas to waste treatment instead of hiding emissions behind vanilla shortcuts.
ric-waste-heat-recovery=Recover fuel gas, desulfurize refinery streams, gasify petroleum coke, blend solid fuel, and convert hot flue gas into usable steam before scrubbing it.
ric-waste-stream-recycling=Standardise acidic liquid waste, solvent waste, etchant waste, mineral dust, ash, scrubber residue, filter cake, and sludge into recoverable environmental processing routes.
ric-nuclear-fuel-chemistry=Packages uranium fuel pellets, cladding and fuel rods into reactor-grade vanilla uranium fuel cells through the RIC nuclear chemistry chain.


