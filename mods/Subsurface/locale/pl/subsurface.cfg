[item-description]
fluid-elevator=Łącz je tak jak podziemne rury.\nUżyj __CONTROL__rotate__, aby zmienić kierunek przepływu po umieszczeniu.
item-elevator=Łącz je tak jak podziemne taśmociągi.\nUżyj __CONTROL__rotate__, aby zmienić kierunek transportu po umieszczeniu.
cave-sealing=Wrzuć kamienie, aby zapieczętować jaskinie lub wejścia do tuneli, których już nie potrzebujesz!
placement-restriction=[font=default-bold][color=yellow]Nie można umieszczać w strefach podziemnych.[/color][/font]

[entity-description]
tunnel-entrance-cable=Zejdź w mroczne głębiny swojej planety! Naciśnij __CONTROL__toggle-driving__, ale uważaj na zanieczyszczenia i brak światła dziennego.
tunnel-exit-cable=Wyjdź na powierzchnię, ku światłu dziennemu! Naciśnij __CONTROL__toggle-driving__, aby zaczerpnąć świeżego powietrza i znów ujrzeć światło dzienne.
surface-drill=Upewnij się, że wydobyty materiał został usunięty, a następnie poczekaj i zobacz, co się stanie.\n[font=default-bold][color=yellow]Pamiętaj, że po wykopaniu wejścia nie można go już usunąć.[/color][/font]
fluid-elevator=Użyj __CONTROL__rotate__ (obrót), aby zmienić kierunek przepływu.\nMożesz również użyć __CONTROL__reverse-rotate__ (odwrotny obrót), aby obracać w kierunku przeciwnym do ruchu wskazówek zegara.
item-elevator=Użyj __CONTROL__rotate__ (obrót), aby zmienić kierunek transportu.\nMożesz również użyć __CONTROL__reverse-rotate__ (odwrotny obrót), aby obracać w kierunku przeciwnym do ruchu wskazówek zegara.
active-air-vent=Aktywny szyb wentylacyjny transportuje zanieczyszczenia z dołu do góry, ale do działania wymaga energii elektrycznej.\n\nPrzepustowość zależy od podstawowej prędkości wytwarzania oraz podwojonej premii do prędkości z modułów, przy czym wartość ta jest redukowana o 80% na każdy poziom podziemny.
air-vent=Pasywny szyb wentylacyjny wyrównuje poziom zanieczyszczeń między obiema powierzchniami. Jeśli na powierzchni występuje większe stężenie zanieczyszczeń, będą one przenikać do podziemi – upewnij się więc, że jest tam wystarczająco dużo miejsca na ich rozproszenie. Nie wymaga zasilania elektrycznego.
prospector=Skanuje obszar w określonym promieniu w poszukiwaniu najbogatszego złoża surowców.
support=Element wsporczy zapobiegający zawaleniom; zapewnia również zasilanie elektryczne i oświetlenie.
subway=Kolejowe połączenie między powierzchnią a podziemiami.

[additional-description]
tunnel-entrance=Można podłączyć do sieci elektrycznej i obwodowej.\nTworzone przez [entity=surface-drill].
surface-drill=Tworzy [entity=tunnel-entrance-cable].

