[tips-and-tricks-item-name]
clear-subsurface-deconstruction=Usuwanie przy użyciu robotów budowlanych
inter-surface-transport=Transport między poziomami
subways=Tunele podziemne

[tips-and-tricks-item-description]
subsurface=Zejdź w mroczne głębiny swojej planety! Naciśnij __CONTROL__toggle-driving__, aby przełączać się między warstwami.\n[entity=tunnel-entrance-cable] oraz wyjście można podłączyć do sieci elektrycznej i obwodów, aby przesyłać energię oraz sygnały między warstwami.\nUżyj [entity=wooden-support] lub [entity=steel-support], aby rozprowadzać energię. Podpory zapewniają również oświetlenie.
clear-subsurface-deconstruction=Zaznacz w podziemiach obszary do oczyszczenia przez roboty budowlane za pomocą planisty demontażu (__CONTROL__select-for-cancel-deconstruct__). Roboty automatycznie wydobędą wszystkie ściany stykające się z tym obszarem. Jeśli obszar znajduje się całkowicie w pustej przestrzeni, nic się nie wydarzy.\nUwaga: w tym przypadku należy użyć akcji „anuluj polecenie demontażu”.
inter-surface-transport=Transportuj przedmioty, płyny lub ciepło między warstwami. Znaczniki wskazują właściwe miejsce do umieszczenia przeciwległego elementu. Po umieszczeniu obiektu zmieniaj wejście i wyjście za pomocą __CONTROL__rotate__, a obracaj w kierunku przeciwnym do ruchu wskazówek zegara za pomocą __CONTROL__reverse-rotate__ (tylko w przypadku wind dla przedmiotów i płynów).
subways=Tunele kolejowe umożliwiają pociągom przemieszczanie się między poziomami.\nUmieść [entity=subway] na obu poziomach, korzystając ze znaczników (podobnie jak w przypadku [tip=inter-surface-transport]).\nDodaj tunel kolejowy do rozkładu jazdy pociągu. Na liście dostępne są przystanki ze wszystkich poziomów, co pozwala na tworzenie wielopoziomowych rozkładów. Warto jednak pamiętać, że przerwania (interrupts) mogą być kłopotliwe – upewnij się, że aktywują się na właściwym poziomie.\nPociągi wjeżdżające do tunelu zachowują swoją prędkość. Nie można nimi sterować ani nie zmieniają one kierunku jazdy, dopóki w pełni się nie pojawią; upewnij się więc, że podziemna sieć kolejowa pomieści najdłuższy wysyłany tam pociąg bez ryzyka zablokowania. Jeden pociąg może znajdować się w dwóch tunelach jednocześnie.
