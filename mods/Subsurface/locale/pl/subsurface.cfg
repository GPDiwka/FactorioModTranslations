[mod-setting-description]
pollution-trains=Włącz tę opcję, aby zwiększyć trudność obsługi pociągów kursujących pod ziemią.
pollution-trains-excludes=Wpisz nazwy prototypów lokomotyw, które nie mają generować zanieczyszczeń (np. lokomotywy elektryczne). Lista oddzielona przecinkami.
subsurface-limit=Maksymalna liczba dostępnych poziomów podziemnych.\nZmiana tego ustawienia w sytuacji, gdy istnieją już głębsze poziomy, NIE powoduje ich usunięcia.
generate-resources-underground=Po włączeniu tej opcji surowce będą generowane również na poziomach podziemnych, przy jednoczesnym zmniejszeniu ich wydajności na powierzchni. Początkowe złoża pozostają nienaruszone i nie będą generowane pod ziemią.\nW przypadku gry na niestandardowych typach świata (np. Railworld) można wyłączyć to ustawienie.\n[color=yellow]Zmiana tego ustawienia nie wpływa na już istniejące złoża![/color]
enable-challenges=Po włączeniu tej opcji poziomy podziemne stają się trudniejsze (pojawiają się zanieczyszczenia i wrogowie), ale oferują w zamian więcej funkcji.\nJeśli chcesz używać tego moda tylko do uporządkowania bazy, bez dodatkowych wyzwań i funkcji, możesz wyłączyć to ustawienie.
show-prospector-range=Wyświetl zasięg skanowania złóż w widoku mapy.

