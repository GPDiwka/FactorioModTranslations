[entity-description]
fe_resonance_shard=Ten artefakt, wykuty przez starożytną cywilizację, stanowił ostatnią linię obrony przed nieustępliwym naporem autonomicznych maszyn bojowych.\nJego złożona struktura sieciowa przewodzi egzotyczne wzorce energetyczne, które zakłócają koordynację wrogich systemów SI, uniemożliwiając im zakładanie nowych baz w zasięgu działania urządzenia.

