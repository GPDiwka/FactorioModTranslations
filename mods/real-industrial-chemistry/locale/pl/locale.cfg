[recipe-description]
ric-passive-component-reel=Pakuje zestawy komponentów biernych na szpule, dzięki czemu proces montażu płytek wykorzystuje jedną, łatwą do identyfikacji jednostkę logistyczną zamiast luzem pakowanych rezystorów, kondensatorów i cewek.
ric-board-assembly-kit=Łączy szpule z komponentami biernymi, drut cynowany, maskę lutowniczą oraz topnik w kompletny zestaw gotowy do montażu na płytce.
ric-active-component-tray=Pakuje zestawy komponentów aktywnych do tacek przeznaczonych do pomieszczeń czystych (cleanroom), stosowanych w montażu powierzchniowym (SMT) i produkcji zaawansowanej elektroniki.
ric-semiconductor-package-tray=Pakuje obudowy półprzewodnikowe do tacek z filtrowaniem, przeznaczonych do montażu powierzchniowego oraz montażu układów scalonych i procesorów.

ric-red-mud-neutralisation=Neutralizuje czerwony szlam z procesu Bayera za pomocą wapna palonego, umożliwiając skierowanie strumienia odpadów do instalacji przetwarzania osadów i oczyszczania ścieków.
logistic-science-pack=Stanowi pierwszy krok przejścia od prymitywnego, ręcznego wytwarzania zasobów do standaryzowanych komponentów przemysłowych i elektronicznej logistyki.
assemribling-machine-1=Pierwsza maszyna montażowa. Wykorzystuje komponenty i prostą elektronikę, ale nie wymaga ram maszynowych.
lab=Pierwszy budynek badawczy. Konstruowany ręcznie z taśmociągów, obwodów, kół zębatych i komponentów przemysłowych.
chemical-science-pack=Niebieski pakiet naukowy; ogniwo łączące, wytwarzane z silników, akumulatorów, tworzyw sztucznych, siarki, zaawansowanych obwodów i komponentów przemysłowych po ukończeniu łańcucha chemicznego dla zielonych pakietów naukowych.
ric-ammonium-nitrate=Neutralizuje kwas azotowy amoniakiem, tworząc azotan amonu – składnik nawozów i materiałów wybuchowych.
ric-ammonium-phosphate=Łączy kwas fosforowy z amoniakiem, tworząc półprodukt do produkcji nawozów fosforanowych.
ric-urea=Wykorzystuje amoniak i dwutlenek węgla do produkcji mocznika.
ric-npk-fertilizer=Łączy azot, fosfor i potas w nawóz przemysłowy.
ric-steam-reforming=Przekształca gaz opałowy i parę wodną w gaz syntezowy oraz dwutlenek węgla.
ric-syngas-to-methanol=Przekształca gaz syntezowy i wodór w metanol.
ric-methanol-to-formaldehyde=Utlenia metanol do formaldehydu.
ric-refinery-offgas-steam-reforming=Poddaje gaz odlotowy z rafinerii reformingowi parowemu, uzyskując gaz syntezowy i wodór; dzięki temu produkty uboczne rafinerii zasilają ciąg technologiczny przemysłu chemicznego, zamiast zalegać w magazynach.
ric-light-solvent-blending=Miesza metanol i naftę w użyteczny strumień rozpuszczalników organicznych, stanowiący rozwiązanie tymczasowe przed uruchomieniem pełnego łańcucha produkcji rozpuszczalników aromatycznych.
ric-deep-naphtha-cracking=Poddaje naftę krakingowi, uzyskując etylen, propylen, butadien i gaz opałowy.
ric-aromatic-extraction=Wydziela benzen i toluen z nafty.
ric-cumene-phenol-acetone=Wykorzystuje benzen, propylen i tlen do produkcji fenolu i acetonu.
ric-phenolic-resin=Łączy fenol i formaldehyd, tworząc żywicę fenolową. 
ric-bisphenol-a=Kondensacja fenolu i acetonu do bisfenolu A, stanowiącego surowiec do produkcji żywicy epoksydowej.
ric-epoxy-resin=Wytwarzanie żywicy epoksydowej z bisfenolu A, epichlorohydryny i sody kaustycznej; produktami ubocznymi są solanka i ścieki.
ric-synthetic-rubber=Łączenie butadienu i styrenu w celu uzyskania kauczuku syntetycznego.
ric-vinyl-chloride=Wytwarzanie chlorku winylu z etylenu i chloru.
ric-pvc=Polimeryzacja chlorku winylu do postaci PVC.
ric-fluorite-acidulation=Wytwarzanie kwasu fluorowodorowego i gipsu z użyciem kwasu siarkowego i fluorytu.
ric-sodium-fluoride=Wytwarzanie fluorku sodu z użyciem sody kalcynowanej i kwasu fluorowodorowego.
ric-aluminium-fluoride=Wytwarzanie fluorku glinu z użyciem tlenku glinu i kwasu fluorowodorowego.
ric-cryolite=Łączenie fluorku sodu i fluorku glinu w kriolit, stosowany w procesie elektrolizy aluminium.
ric-hall-heroult-aluminium=Wytwarzanie wlewków aluminium i dwutlenku węgla z użyciem tlenku glinu, kriolitu i grafitu.
ric-light-alloy=Łączenie aluminium, niklu, cynku i węglika krzemu w lekki stop konstrukcyjny.
ric-low-density-structure=Wytwarzanie konstrukcji o małej gęstości z lekkiego stopu, stali, tworzywa sztucznego, kauczuku syntetycznego i żywicy epoksydowej.
ric-galena-roasting=Prażenie galeny w obecności tlenu w celu uzyskania tlenku ołowiu i dwutlenku siarki.
ric-lead-smelting=Redukcja tlenku ołowiu koksem w celu uzyskania płyt ołowianych.
ric-cassiterite-reduction=Redukcja kasyterytu koksem w celu uzyskania płyt cynowych.
ric-solder=Łączenie cyny i ołowiu w lutowie stosowane w elektronice.
ric-lead-acid-accumulator=Montaż akumulatorów z płyt ołowianych, baterii, tworzywa sztucznego, kabli miedzianych i kwasu siarkowego.
ric-chromite-roasting=Prażenie chromitu z wapnem i tlenem w celu uzyskania tlenku chromu.
ric-ferrochrome=Redukcja tlenku chromu koksem i stalą w celu uzyskania żelazochromu. 
ric-pyrolusite-reduction=Redukcja piroluzytu koksem w celu uzyskania tlenku manganu.
ric-ferromanganese=Redukcja tlenku manganu koksem i stalą w celu wytworzenia żelazomanganu.
ric-stainless-steel-plate=Wytwarzanie stopów stali z dodatkiem żelazochromu, niklu i żelazomanganu.
ric-corrosion-resistant-pipe=Produkcja rur ze stali nierdzewnej wyłożonych PVC, przeznaczonych do maszyn pracujących w środowisku korozyjnym.
ric-magnesium-chloride-from-brine=Odzysk chlorku magnezu z solanki przy użyciu mleka wapiennego.
ric-magnesium-electrolysis=Elektroliza chlorku magnezu w celu uzyskania wlewków magnezu i chloru.
ric-ilmenite-sulfate-leach=Ługowanie ilmenitu kwasem siarkowym w celu wytworzenia dwutlenku tytanu i koncentratu żelaza.
ric-rutile-chlorination=Chlorowanie rutylu w obecności koksu w celu wytworzenia czterochlorku tytanu.
ric-kroll-titanium-sponge=Redukcja czterochlorku tytanu magnezem w celu uzyskania gąbki tytanowej i chlorku magnezu.
ric-titanium-alloy=Wytwarzanie stopów tytanu z aluminium, molibdenem i niklem.
ric-spodumene-calcination=Kalcynacja spodumenu z wapnem w celu uzyskania koncentratu litu.
ric-lithium-carbonate=Wytwarzanie węglanu litu z koncentratu litu i węglanu sodu.
ric-lithium-fluoride=Wytwarzanie fluorku litu z węglanu litu i kwasu fluorowodorowego.
ric-battery-electrolyte=Wytwarzanie elektrolitu do akumulatorów z fluorku litu, kwasu fosforowego i etylenu.
ric-lithium-ion-cell=Produkcja ogniw litowo-jonowych z wodorotlenku litu, grafitu, wyprowadzeń elektrod, tworzyw sztucznych i elektrolitu.
ric-lithium-ion-battery=Montaż ogniw litowo-jonowych w gotowe zestawy akumulatorowe.
ric-natural-gas-separation=Rozdzielanie gazu ziemnego na metan, etan, propan, butan i gaz opałowy.
ric-sour-gas-sweetening=Odsiarczanie gazu kwaśnego (usuwanie związków siarki) za pomocą wodorotlenku sodu w celu odzyskania gazu ziemnego i siarkowodoru.
ric-methane-steam-reforming=Reformowanie parowe metanu w celu uzyskania gazu syntezowego i wodoru.
ric-methane-partial-oxidation=Utlenianie częściowe metanu w celu uzyskania gazu syntezowego i dwutlenku węgla. 
ric-ethane-steam-cracking=Kraking parowy etanu, dający etylen, metan i wodór.
ric-propane-dehydrogenation=Dehydrogenacja propanu do propylenu i wodoru.
ric-butane-cracking=Kraking butanu, dający butadien, gaz opałowy i wodór.
ric-hydrogen-sulfide-oxidation=Utlenianie siarkowodoru do dwutlenku siarki i wody.
ric-claus-sulfur-recovery=Odzysk siarki pierwiastkowej z siarkowodoru i dwutlenku siarki.
iron-plate=Tymczasowa metoda produkcji (na wczesnym etapie gry) z rozdrobnionego hematytu. Produkcja przemysłowa przenosi się do wielkiego pieca i odlewni.
copper-plate=Tymczasowa metoda produkcji (na wczesnym etapie gry) z rozdrobnionego chalkopirytu. Produkcja przemysłowa przenosi się do wytapiania koncentratu i odlewni.
ric-recover-sulfur=Redukcja dwutlenku siarki węglem przemysłowym w celu odzyskania siarki pierwiastkowej.
ric-make-sulfuric-acid=Hydratacja trójtlenku siarki do kwasu siarkowego; powstaje przy tym niewielki strumień kwaśnych ścieków.
ric-polyethylene-plastic=Polimeryzacja etylenu do postaci prętów z tworzywa sztucznego, wykorzystywanych w zaawansowanych obwodach, akumulatorach i automatyzacji badań chemicznych.
ric-heavy-residue-processing=Przetwarzanie ciężkich pozostałości na użyteczne paliwo i odpady, zamiast pozostawiania ich jako bezużytecznej cieczy.
ric-battery=Przejściowy typ akumulatora wykorzystujący żelazo, miedź, tworzywo sztuczne i elektrolit na bazie kwasu siarkowego – stosowany, zanim technologia litowo-jonowa stanie się dostępna.
ric-advanced-circuit=Przejściowy wariant zaawansowanego obwodu wykorzystujący obwody elektroniczne, tworzywo sztuczne, przewody miedziane i siarkę; pozwala to na prowadzenie badań chemicznych bez konieczności oczekiwania na elektronikę z pomieszczeń czystych (cleanroom).
transport-belt=Początkowe taśmociągi są mechaniczne: wymagają jedynie płyt żelaznych i kół zębatych.
inserter=Pierwszy elektromechaniczny element logistyczny, wykorzystujący styki i prosty obwód elektroniczny.
assembling-machine-2=Ulepszanie automatów montażowych trwa aż do etapu ram maszynowych następującego po technologii przetwarzania rudy.
electric-mining-drill=W trybie pełnej przebudowy (full-overhaul) elektryczne wiertnice górnicze wykorzystują komponenty przemysłowe.
chemical-plant=W trybie pełnej przebudowy zakłady chemiczne wykorzystują ramy maszyn i komponenty przemysłowe.
oil-refinery=W trybie pełnej przebudowy rafinerie wykorzystują wiele ram maszyn i komponentów przemysłowych.
pumpjack=W trybie pełnej przebudowy pompy wiertnicze wykorzystują ramy maszyn i komponenty przemysłowe.
ric-ore-sorter=Maszyna do suchej obróbki rudy (dostępna po etapie automatyzacji), służąca do sortowania i wzbogacania surowej rudy.
ric-ore-washer=Maszyna do mokrej obróbki rudy, stosowana po etapie suchego sortowania/wzbogacania.
ric-waste-treatment-plant=Kompaktowa instalacja do oczyszczania ścieków i odpadów z procesu mokrej obróbki rudy.
ric-chemical-reactor=Uniwersalny reaktor chemiczny do procesów chemicznych RIC.
ric-distillation-column=Rozdziela ropę naftową i smołę węglową na użyteczne frakcje petrochemiczne.
pipe=Podstawowa rura. Wykonana wyłącznie z żelaza, aby uruchomienie pierwszej elektrowni parowej nie wymagało elektroniki.
pipe-to-ground=Pierwsze ulepszenie rury; wprowadza wymóg użycia komponentów przemysłowych.
underground-belt=Zrównoważone ulepszenie logistyki taśmowej; wymaga mniejszej liczby komponentów przemysłowych.
splitter=Zrównoważony rozdzielacz taśmowy; wymaga mniejszej liczby komponentów.
fast-transport-belt=Szybki element logistyczny; wymaga stali i komponentów przemysłowych.
fast-underground-belt=Szybkie ulepszenie rury podziemnej; wymaga stali i mniejszej liczby komponentów przemysłowych.
fast-splitter=Szybki rozdzielacz taśmowy; wymaga stali, układów elektronicznych i mniejszej liczby komponentów.
engine-unit=Mechaniczny silnik pośredni; wymaga walcowanej stali, kół zębatych, rur, ramy maszyny i komponentów przemysłowych (do pakietów nauk chemicznych).
electric-engine-unit=Silnik elektryczny; zrównoważony pod kątem zużycia smaru, układów elektronicznych, jednej ramy maszyny i silnika mechanicznego.
steel-furnace=Ulepszony piec stalowy z okładziną ogniotrwałą; wymaga cegieł ogniotrwałych i komponentów.
electric-furnace=Piec elektryczny wyższej klasy; wymaga cegieł ogniotrwałych, zaawansowanych układów elektronicznych i komponentów.
medium-electric-pole=Średnie słupy elektryczne; wprowadzają wymóg użycia komponentów przemysłowych.
big-electric-pole=Duże słupy elektryczne; wprowadzają wymóg użycia komponentów przemysłowych.
substation=Stacje transformatorowe; wymagają ram maszyn, zaawansowanych układów elektronicznych i komponentów przemysłowych. 
speed-module=Moduł pierwszego poziomu, wytwarzany z zaawansowanych obwodów i komponentów przemysłowych produkcji RIC.
productivity-module=Moduł pierwszego poziomu, wytwarzany z zaawansowanych obwodów i komponentów przemysłowych produkcji RIC.
efficiency-module=Moduł pierwszego poziomu, wytwarzany z zaawansowanych obwodów i komponentów przemysłowych produkcji RIC.
stone-furnace=Pierwszy etap wytapiania. Konstrukcja wyłącznie kamienna, zapewniająca prosty początek rozgrywki.
burner-mining-drill=Urządzenie do wstępnego, ręcznego wydobycia rudy. Wymaga jedynie podstawowych zasobów: żelaza, kamienia i kół zębatych.
small-electric-pole=Podstawowy słup energetyczny. Prosta konstrukcja do przesyłu energii na wczesnym etapie.
boiler=Pierwszy kocioł parowy; budowany z pieca, rury i kamienia.
steam-engine=Pierwszy generator energii. Infrastruktura energetyczna oparta na mechanice.
offshore-pump=Pierwsze źródło wody dla układu parowego. Prosta konstrukcja mechaniczna.
automation-science-pack=Pierwszy pakiet naukowy. Łączy płyty, koła zębate i prymitywne płytki obwodów w celu opracowania technologii automatyzacji.
ric-crusher=Pierwsza maszyna do obróbki rudy. Zasilana paliwem, dostępna przed opracowaniem automatyzacji.
ric-crush-hematite=Rozdrabnia hematyt na pokruszoną rudę żelaza, gotową do przetworzenia w piecu.
ric-crush-chalcopyrite=Rozdrabnia chalkopiryt na pokruszoną rudę miedzi gotową do przetworzenia w piecu.
ric-electrical-contact=Podstawowy styk elektroniczny stosowany w prymitywnych płytkach i podzespołach przemysłowych.
ric-insulating-board=Prymitywny materiał izolacyjny do wczesnej elektroniki i ram maszyn.
ric-primitive-circuit-board=Wczesny półprodukt w postaci płytki drukowanej, stosowany przed wdrożeniem pełnej produkcji chemicznej i elektronicznej.
electronic-circuit=Podstawowy układ elektroniczny złożony z prymitywnych płytek drukowanych, kabli i żelaza.
ric-industrial-components=Uniwersalny, wczesny podzespół mechaniczno-elektryczny stosowany w maszynach RIC.
ric-machine-frame=Uniwersalna rama maszyny, służąca do budowy urządzeń do przetwarzania rudy, procesów chemicznych i metalurgicznych.
ric-wash-hematite=Proces mokrego wzbogacania rudy żelaza (hematytu), dający koncentrat, odpady poflotacyjne i ścieki.
ric-wash-chalcopyrite=Proces mokrego wzbogacania rudy miedzi (chalkopirytu), dający koncentrat, odpady poflotacyjne i ścieki.
ric-treat-wastewater=Podstawowe oczyszczanie ścieków dla wczesnych układów płukania i neutralizacji.
ric-coke-oven=Wczesna maszyna do koksowania; przetwarza węgiel na koks do wykorzystania w metalurgii wielkopiecowej.
ric-sintering-plant=Specjalistyczna, wczesna maszyna do aglomeracji koncentratu żelaza w spiek wielkopiecowy.
ric-make-coke=Podstawowa, wczesna metoda produkcji koksu; dostarcza koks oraz produkty uboczne: żelazo, stal, kamień miedziowy, węgiel, smołę i gaz.
ric-make-coke-from-crushed-coal=Ulepszona metoda produkcji koksu, dostępna po wdrożeniu procesu kruszenia węgla.
ric-blast-furnace=Piec przemysłowy do redukcji koncentratów na surówkę żelaza i miedź surową (typu blister).
ric-refractory-brick=Cegła ogniotrwała stosowana w piecach i infrastrukturze odlewniczej.
