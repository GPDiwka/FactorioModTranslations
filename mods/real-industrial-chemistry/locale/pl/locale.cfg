[technology-description]
ric-ore-processing-1=Pierwszy kamień milowy procesu RIC: sortownik rudy, ramy maszyn, topnik wapienny, wzbogacanie na sucho, prymitywne mosty płytowe i odciążenie składowiska odpadów.
ric-ore-processing=Odblokowuje sortownik rudy, podstawowe sortowanie surowej rudy, klasyfikację ziarnową, wzbogacanie na sucho oraz ramy maszyn.
ric-coking=Udostępnia piece koksownicze, koks, smołę węglową, gaz opałowy i węgiel techniczny na potrzeby hutnictwa oraz rozruchu przemysłu petrochemicznego.
ric-blast-furnace=Udostępnia wielkie piece, spiekanie, odlewanie, surówkę żelaza, kamień miedziowy, miedź surową (blister) oraz wstępne oczyszczanie żużla.
ric-steel-processing=Udostępnia walcownię i ścieżkę produkcji kęsisk. Zastępuje to uproszczoną metodę produkcji stali z podstawowej wersji gry wytwarzaniem kształtowej stali przemysłowej.
ric-basic-chemistry=Dodaje podstawowe urządzenia chemiczne i instalację rozdziału powietrza po ustabilizowaniu produkcji stali.
ric-electrolysis=Odblokowuje elektrolizery i elektrolizę wody w celu uzyskania wodoru i tlenu.
ric-chlor-alkali-processing=Przetwarza solankę na chlor, wodorotlenek sodu i kwas solny.
ric-sulfur-processing=Łączy procesy prażenia miedzi i spalania siarkowodoru z produkcją dwutlenku siarki.
ric-ammonia-processing=Łączy azot i wodór w amoniak, a następnie utlenia go do kwasu azotowego.
ric-oil-processing=Rozpoczyna frakcjonowanie smoły i ropy naftowej bez konieczności wcześniejszego opracowania technologii chemicznej.
ric-plastics=Przetwarza surowce petrochemiczne na standardowe sztabki tworzyw sztucznych, wykorzystywane do produkcji układów elektronicznych i w technologii chemicznej.
ric-lubricant=Przetwarza ciężkie pozostałości na środki smarne i bitum, tworząc pierwsze ujście dla produktów ubocznych ciężkich frakcji ropy.
chemical-science-pack=Umożliwia przejście z produkcji pakietów naukowych poziomu zielonego na niebieski po ustabilizowaniu produkcji silników, akumulatorów, zaawansowanych układów elektronicznych, tworzyw sztucznych, siarki, kwasu siarkowego oraz systemów utylizacji odpadów.
advanced-circuit=Umożliwia przejście do produkcji zaawansowanych układów elektronicznych po uruchomieniu wytwarzania płytek drukowanych, tworzyw sztucznych, akumulatorów i kwasu siarkowego.
ric-fertilizer-chemistry=Wykorzystuje amoniak, kwas azotowy, kwas fosforowy, dwutlenek węgla i potas do produkcji półproduktów nawozowych oraz surowca do wytwarzania materiałów wybuchowych na bazie azotanu amonu. 
ric-syngas-chemistry=Przetwarza gaz paliwowy na gaz syntezowy, metanol, formaldehyd, wodór, metan, tlenek węgla oraz strumień lekkich rozpuszczalników.
ric-olefins-and-aromatics=Poddaje krakingowi benzynę lekką (naftę) w celu uzyskania olefin i wydziela węglowodory aromatyczne do produkcji fenolu, acetonu, styrenu i żywic.
ric-rubber-and-resins=Wytwarza żywice fenolowe, bisfenol A, żywice epoksydowe, kauczuk syntetyczny i polipropylen w oparciu o rozbudowany łańcuch petrochemiczny.
ric-chlorinated-polymers=Wykorzystuje technologie oparte na etylenie i chlorze do produkcji chlorku winylu oraz PVC.
ric-fluorine-chemistry=Przetwarza fluoryt na kwas fluorowodorowy, fluorek sodu, fluorek glinu i kriolit.
ric-aluminium-smelting=Wykorzystuje proces Halla-Héroulta do przekształcania tlenku glinu w wlewki, płyty i przewody aluminiowe.
ric-light-alloys=Wykorzystuje aluminium, nikiel, cynk, węglik krzemu, kauczuk i żywice epoksydowe do wytwarzania lekkich materiałów konstrukcyjnych i struktur o małej gęstości.
ric-lead-tin-metallurgy=Przetwarza galenę i kasyteryt na ołów, cynę oraz lutowie.
ric-lead-acid-storage=Wykorzystuje płyty ołowiowe i kwas siarkowy do produkcji akumulatorów kwasowo-ołowiowych.
ric-alloy-steel-processing=Przetwarza chromit, piroluzyt, nikiel i stal na żelazostopy oraz stal nierdzewną.
ric-corrosion-resistant-components=Wykorzystuje stal nierdzewną i PVC do produkcji kół zębatych oraz rur odpornych na korozję.
ric-magnesium-processing=Odzyskuje chlorek magnezu z solanki i poddaje go elektrolizie w celu uzyskania magnezu do redukcji tytanu.
ric-titanium-metallurgy=Przetwarza ilmenit i rutyl na dwutlenek tytanu, czterochlorek tytanu, gąbkę tytanową oraz płyty tytanowe.
ric-lithium-chemistry=Przetwarza spodumen na węglan litu, wodorotlenek litu, fluorek litu oraz elektrolit do akumulatorów.
ric-titanium-alloys=Łączy tytan, aluminium, molibden i nikiel w zaawansowane stopy tytanu.
ric-advanced-battery-chemistry=Umożliwia produkcję wyprowadzeń akumulatorów, ogniw litowo-jonowych oraz gotowych pakietów akumulatorów litowo-jonowych.
ric-natural-gas-processing=Przetwarza gaz ziemny na metan, lekkie alkany, gaz syntezowy, wodór oraz surowce olefinowe.
ric-sour-gas-processing=Odsiarcza gaz kwaśny i odzyskuje siarkę poprzez utlenianie siarkowodoru oraz proces Clausa.
ric-wet-ore-processing=Dodaje płukanie rudy oraz obsługę ciśnienia ścieków i odpadów poflotacyjnych, gdy technologia „zielonej nauki” pozwoli na obsługę większych cykli przetwórczych.
ric-waste-treatment=Dodaje zakład utylizacji odpadów i wstępne receptury neutralizacji, zapewniając ujście dla wód popłuczynowych, żużla, odpadów poflotacyjnych oraz wód kwaśnych.
ric-sulfur-recovery=Odzyskuje siarkę pierwiastkową z dwutlenku siarki na potrzeby produkcji akumulatorów, zaawansowanych obwodów, materiałów wybuchowych i badań chemicznych.
ric-sulfuric-acid-production=Utlenia dwutlenek siarki i uwadnia trójtlenek siarki, tworząc kwas siarkowy dla przemysłu akumulatorowego i chemicznego.
ric-naphtha-cracking=Poddaje krakingowi naftę (benzynę ciężką), uzyskując surowce polimerowe i gaz opałowy na potrzeby produkcji tworzyw sztucznych.
automation=Odblokowuje pierwszy automat montażowy. W modzie RIC stanowi to przejście od początkowej fazy opartej na paliwach stałych do powtarzalnej produkcji. 
battery=Produkuje baterie z tworzywa sztucznego wytwarzanego przez RIC oraz kwasu siarkowego.
ric-component-logistics=Wczesny podział logistyki; dostępny krótko po technologii Automatyzacja.
ric-fast-logistics=Szybka logistyka; ulepszenie wymagające stali i komponentów, dostępne po technologii Stal przemysłowa.
ric-mechanical-engines=Silniki mechaniczne; dostępne po technologii Stal przemysłowa, bez konieczności wcześniejszego opracowania technologii związanych z nauką chemiczną.
ric-electric-engines=Silniki elektryczne; ulepszenie z ery nauki chemicznej, dostępne po zapewnieniu produkcji smaru i ram maszynowych.
ric-basic-modules=Podstawowe moduły; ulepszenie dostępne po technologii Zaawansowane obwody, z mniejszym zapotrzebowaniem na komponenty.
ric-sulfide-flotation=Dodaje flotację drobnych frakcji miedzi oraz oczyszczanie piany; dostępne po opanowaniu mokrej obróbki rudy i podstaw chemii.
ric-refinery-fractionation=Dodaje destylację próżniową, koksowanie opóźnione, usuwanie zanieczyszczeń z wód kwaśnych, odzysk i reforming gazów odlotowych, koks naftowy, lepiszcze asfaltowe oraz ścieżki produkcji paliw stałych RIC.
ric-petrochemical-cracking-reforming=Rozszerza petrochemię o hydroodsiarczanie olejów napędowych, kraking parowy, oczyszczanie benzyny pirolitycznej, ekstrakcję reformatu/związków aromatycznych oraz mieszanie paliw z udziałem alkilatu.
ric-integrated-steelmaking=Dodaje bezpośrednią redukcję żelaza, produkcję stali metodą tlenową, wlewki płaskie (slaby), walcowanie blach oraz kształtowane ramy stalowe dla etapu przemysłowej metalurgii.
ric-copper-fire-refining=Dodaje przetapianie błyskawiczne, rafinację ogniową miedzi surowej, odlewanie anod z miedzi rafinowanej ogniowo oraz walcowane blachy miedziane.
ric-light-metal-forming=Dodaje wlewki i blachy aluminiowe, wytłaczanie aluminium oraz panele konstrukcyjne ze stopów lekkich.
ric-stainless-forming=Dodaje wsady stopowe (żelazostopy), wlewki ze stali nierdzewnej, walcowanie blach nierdzewnych oraz wykładziny ogniotrwałe dla zaawansowanych urządzeń technologicznych.
ric-titanium-forming=Dodaje wlewki i blachy tytanowe jako elementy konstrukcyjne dla zaawansowanego sprzętu i infrastruktury późnego etapu gry.
ric-industrial-fuels-and-emissions=Przetwarzaj węgiel i koks na konkretne nośniki energii, przygotowuj sorbenty do płuczek spalin i kieruj zanieczyszczone gazy do instalacji utylizacji, zamiast ukrywać emisje za uproszczeniami z podstawowej wersji gry. 
ric-waste-heat-recovery=Odzyskuj gazy opałowe, odsiarczaj strumienie rafineryjne, poddawaj zgazowaniu koks naftowy, mieszaj paliwa stałe oraz przekształcaj gorące spaliny w użyteczną parę technologiczną przed ich oczyszczaniem.
ric-waste-stream-recycling=Standaryzuj kwaśne odpady ciekłe, zużyte rozpuszczalniki i odczynniki trawiące, pył mineralny, popiół, osady z instalacji oczyszczania gazów, placki filtracyjne oraz szlamy, kierując je do procesów odzysku przyjaznych dla środowiska.
ric-nuclear-fuel-chemistry=Formuj pastylki paliwa uranowego, koszulki i pręty paliwowe w gotowe ogniwa paliwowe klasy reaktorowej, wykorzystując łańcuch procesów chemii jądrowej RIC.


# 0.8.4 recipe clarity and technology tooltip pass
ric-advanced-ore-processing=Odblokowuje wydajniejsze metody przygotowania rudy, wykraczające poza podstawowe kruszenie i sortowanie.
ric-advanced-process-equipment=Odblokowuje ciężki sprzęt technologiczny przystosowany do pracy pod ciśnieniem, w warunkach korozyjnych, filtracji oraz ciągłych procesów chemii przemysłowej.
ric-advanced-process-machinery=Odblokowuje zaawansowane reaktory, kolumny i maszyny elektrochemiczne stosowane w późnych etapach łańcuchów produkcji przemysłowej.
ric-advanced-radiochemical-processing=Odblokowuje zaawansowane procesy separacji uranu i substancji radiochemicznych na potrzeby przemysłu jądrowego.
ric-advanced-refractories=Odblokowuje ulepszone materiały ogniotrwałe do pieców i konwertorów pracujących w wysokich temperaturach oraz do produkcji stopów.
ric-ceramics=Odblokowuje proszki ceramiczne, filtry, izolatory i materiały żaroodporne dla przemysłu chemicznego i elektronicznego.
ric-circuit-board-fabrication=Odblokowuje proces wytwarzania płytek drukowanych, przekształcający miedź, żywicę, włókno szklane i chemikalia w gotowe podzespoły elektroniczne.
ric-construction-materials=Odblokowuje przemysłowe materiały budowlane, takie jak beton, szkło, wapno oraz materiały konstrukcyjne dla instalacji technologicznych.
ric-glass-chemistry=Odblokowuje technologie produkcji szkła i włókna szklanego na potrzeby elektroniki, budownictwa i aparatury przemysłowej.
ric-high-tech-electronics=Odblokowuje zaawansowane półprodukty elektroniczne do systemów sterowania procesami, maszyn do pomieszczeń czystych (cleanroom) i produkcji zaawansowanych technologii.
ric-hydrometallurgy=Odblokowuje metody odzysku metali obejmujące ługowanie, oczyszczanie roztworów, wytrącanie i elektrolityczne wydzielanie metali.
ric-industrial-catalysis=Odblokowuje technologie wytwarzania złóż katalitycznych, nośników katalizatorów oraz katalizatorów z metali szlachetnych dla wydajnych procesów chemicznych.
ric-industrial-oxidizers=Odblokowuje metody produkcji kwasu azotowego, nadtlenku wodoru i innych utleniaczy stosowanych w przemyśle chemicznym oraz produkcji materiałów wybuchowych.
ric-lime-and-soda-chemistry=Odblokowuje technologie produkcji wapna palonego, wapna gaszonego, sody kalcynowanej i związków węglanowych, stosowane w gospodarce odpadami i przemyśle.
ric-phosphate-chemistry=Odblokowuje procesy przetwarzania fosforanów na potrzeby produkcji nawozów i chemii nieorganicznej.
ric-precious-metal-refining=Odblokowuje metody ługowania, wytrącania i rafinacji metali szlachetnych w procesach przetwarzania srebra i złota. 
ric-rare-earth-processing=Odblokowuje procesy ługowania i separacji metali ziem rzadkich, niezbędne do wytwarzania zaawansowanych materiałów.
ric-real-ore-processing=Odblokowuje dedykowane metody przetwarzania rud, wykraczające poza uproszczone mechanizmy podstawowej wersji gry.
ric-refined-concrete=Odblokowuje wytrzymalsze materiały budowlane, wykorzystujące procesy przemysłowej alchemii w zakresie minerałów i spoiw.
ric-semiconductor-fabrication=Odblokowuje etapy produkcji półprzewodników, w tym wytwarzanie płytek w warunkach czystego pomieszczenia, litografię oraz pakowanie.
ric-sulfate-leaching=Odblokowuje proces ługowania siarczanowego, służący do odzyskiwania metali z przygotowanych wsadów rudy.
ric-tool-steel-and-high-temperature-alloys=Odblokowuje metody wytwarzania stali narzędziowych, żelazostopów oraz metali żaroodpornych.
ric-tungsten-molybdenum-processing=Odblokowuje procesy przetwarzania rud wolframu i molibdenu, w tym wytrącanie i produkcję metali.
ric-uranium-chemistry=Odblokowuje procesy ługowania uranu oraz operacje chemiczne poprzedzające zaawansowane prace izotopowe.
ric-uranium-fluoride-processing=Odblokowuje procesy chemiczne z wykorzystaniem fluorków, niezbędne do zaawansowanego przetwarzania uranu.

Logistics=Dodaje podstawowe narzędzia do trasowania taśm po automatyzacji, przed wprowadzeniem pierwszych większych maszyn do przeróbki rudy.
Logistic-science-pack=Wprowadza zieloną naukę po udostępnieniu pierwszej trasy metalowej zgodnej z zasadami czerwonej nauki.
Ric-controlled-release-fertilizers=Dodaje odzysk siarczanu amonu, nawóz azotanowy stabilizowany wapieniem, mieszanie złożonych NPK oraz produkcję nawozów o kontrolowanym uwalnianiu w powłoce żywicowej.
Ric-polymer-additives=Dodaje dodatki do polimerów, plastyfikatory, mieszanie gumy, produkcję wzmocnionych arkuszy polimerowych oraz mieszanki do odlewania żywic.
Ric-byproduct-utilisation=Przetwarza odpady, pozostałości mineralne, żużel, gips i pył metalurgiczny na użyteczne kruszywa budowlane, płyty, dodatki do cementu i niskogatunkowy wsad do pieców.
ric-advanced-board-materials=Dodaje prepreg ze szkła epoksydowego, laminat miedziany wzmacniany, tusz maski lutowniczej, wkłady rozpuszczalnikowe do pomieszczeń czystych, precyzyjne trawienie i montaż paneli obwodów o wysokiej gęstości.
ric-process-media-engineering=Dodaje adsorbenty zeolitowe, aktywowany tlenek glinu, złoże ochronne, ładunki katalizatorów i odzysk drobnych cząstek zużytego katalizatora dla rafinerii i przetwórstwa petrochemicznego.
ric-industrial-gas-utilities=Dodaje sprężone powietrze, suche powietrze pomiarowe, gazową osłonę azotową i wzbogacone tlenem pętle technologiczne dla zaawansowanych systemów przemysłowych.
ric-utility-water-treatment=Dodaje polerowanie wody demineralizowanej, mieszanie inhibitorów korozji, uzdatnianie wody zasilającej kotły, przygotowywanie wody chłodzącej, obsługę odmulania i polerowanie zużytej wody technologicznej.
ric-emissions-control-equipment=Dodaje dedykowany sprzęt do filtrów workowych i mokrych skruberów, dzięki czemu gorące spaliny przemysłowe są schładzane, filtrowane, odsiarczane i zawracane do istniejących pętli odzysku popiołu, gipsu i ścieków.
ric-advanced-wastewater-treatment=Dodaje wstępne klarowanie i prasowanie osadu w filtrze, dzięki czemu oczyszczanie ścieków przemysłowych staje się etapowym procesem separacji ciecz-ciało stałe zamiast pojedynczej, ogólnej receptury oczyszczania.

ric-engineering-polymers=Opracowuje plastyfikatory, pakiety dodatków, wzmacniane arkusze polimerowe, mieszanki gumowe oraz materiały żywiczne do odlewania, przeznaczone dla zaawansowanego przemysłu.
ric-nauvis-emissions-recovery-integration=Integruje baterie koksownicze, huty, instalacje chemii siarki, systemy zagospodarowania gazów odlotowych z rafinerii, gospodarkę wodą technologiczną i chłodzącą, odzysk ciepła odpadowego, filtrację workową, płuczki mokre oraz oczyszczanie ścieków w jeden przemysłowy obieg odzysku.

