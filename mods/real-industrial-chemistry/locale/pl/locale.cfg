[entity-description]
ric-process-machine-placement-contract=Umowa dotycząca rozmieszczenia urządzeń technologicznych Industrial Alchemy, uwzględniająca zweryfikowane wymiary zajmowanej powierzchni oraz układu rurociągów.
ric-real-resource=Dedykowane złoże rudy rzeczywistej lub minerału przemysłowego Industrial Alchemy.
ric-gas-resource=Dedykowane złoże gazu ziemnego lub gazu kwaśnego Industrial Alchemy.
ric-ore-sorter=Maszyna do suchej obróbki rudy, służąca do segregacji podstawowych rud i kamienia na rudy rzeczywiste, minerały oraz wstępne koncentraty.

ric-crusher=Kruszarka (zasilana paliwem) służąca do przerobu rud, kamienia i węgla na kruszywo. Zbuduj ją jako pierwszą.
ric-ore-washer=Maszyna do obróbki na mokro; przemywa pokruszone rudy i drobne frakcje, uzyskując czystsze koncentraty oraz oddzielając odpady i ścieki.
ric-flotation-cell=Komora flotacyjna (technologia „zielonej nauki”) do wzbogacania drobnych frakcji rud siarczkowych i piany flotacyjnej przed dalszymi procesami hydrometalurgicznymi.
ric-coke-oven=Piec koksowniczy przetwarzający węgiel (lub jego drobne frakcje) na koks, smołę węglową i gaz opałowy (produkty dla wczesnych etapów metalurgii i petrochemii).
ric-blast-furnace=Wielki piec – podstawowe urządzenie wczesnej metalurgii do produkcji surówki żelaza, kamienia miedziowego, żużla i wsadu stalowniczego.
ric-sintering-plant=Spiekalnia przekształcająca drobny koncentrat żelaza w spiek, zapewniając wielkiemu piecowi odpowiedni wsad żelazonośny.
ric-casting-machine=Odlewnia formująca surówkę żelaza i miedź surową (typu blister) w standardowe płyty na wczesnym etapie przemysłowej produkcji metali.
ric-rolling-mill=Walcarka kształtująca kęsy stalowe oraz późniejsze płyty i arkusze metalu w gotowe elementy i półprodukty przemysłowe.
ric-waste-treatment-plant=Zakład utylizacji odpadów; przetwarza odpady poflotacyjne, żużel, wody kwaśne i zneutralizowane strumienie odpadów, zapobiegając przestojom wczesnego przemysłu.
ric-chemical-reactor=Uniwersalny reaktor chemiczny do wczesnych procesów chemii nieorganicznej, neutralizacji, pracy z kwasami i receptur pośrednich.
ric-air-separator=Separator powietrza rozdzielający je na tlen i azot na potrzeby metalurgii, przetwórstwa siarki i późniejszej chemii wysokociśnieniowej.
ric-electrolyzer=Elektrolizer do procesów elektrochemicznych obejmujących wodę, solankę, elektrolizę chlorowo-alkaliczną, fluor oraz późniejsze zaawansowane metody elektrolityczne.
ric-roaster=Piec prażalniczy (utleniający) do koncentratów siarczkowych i procesów chemii mineralnej wymagających obsługi gazowych lub kwaśnych produktów ubocznych.
ric-distillation-column=Kolumna destylacyjna do wstępnej frakcjonacji ropy naftowej, smoły węglowej, nafty, gazu opałowego i ciężkich pozostałości.
ric-electrowinning-cell=Urządzenie hydrometalurgiczne do odzyskiwania metali w postaci katod z roztworów siarczanowych lub ługów.
ric-vacuum-distillation-column=Zaawansowana kolumna rafinacyjna do przerobu ciężkich pozostałości i frakcjonowania próżniowego, stosowana po uruchomieniu podstawowej destylacji. 
ric-delayed-coker = Zaawansowana instalacja rafineryjna służąca do krakingu pozostałości próżniowej na koks naftowy i lżejsze strumienie rafineryjne.
ric-hydrotreater=Zaawansowany reaktor ciśnieniowy służący do usuwania siarki i uzyskiwania czystszych frakcji rafineryjnych.
ric-catalytic-reformer=Zaawansowana instalacja katalityczna do produkcji reformatu i związków aromatycznych.
ric-steam-cracker=Zaawansowana instalacja petrochemiczna do krakingu olejów napędowych i lekkich węglowodorów na surowce do produkcji polimerów.
ric-cleanroom-assembler=Stanowisko montażowe w kontrolowanym środowisku, przeznaczone do płytek drukowanych, półprzewodników, wafli krzemowych i precyzyjnej elektroniki.
ric-catalytic-reactor=Reaktor procesowy wykorzystujący katalizator; stosowany w produkcji amoniaku, metanolu, nadtlenków, reformingu oraz w chemii specjalistycznej.
ric-high-pressure-reactor=Ciśnieniowy reaktor procesowy przeznaczony do syntezy wysokociśnieniowej i procesów uwodorniania.
ric-advanced-distillation-column=Wydajna kolumna rozdzielająca do zaawansowanych frakcji chemicznych i rafineryjnych.
ric-advanced-electrochemical-cell=Zaawansowane urządzenie elektrochemiczne do elektrolizy i elektrorafinacji wysokiej klasy.

ric-limestone=Złoże wapienia. Niezbędne na wczesnym etapie produkcji topników i kruszywa wapiennego.
ric-quartz=Złoże kwarcu; surowiec do produkcji krzemionki i materiałów dla elektroniki.
ric-gypsum=Złoże gipsu; surowiec do produkcji siarczanów, materiałów budowlanych i zagospodarowania produktów ubocznych.
ric-rock-salt=Złoże soli kamiennej; źródło chloru, solanki, sodu i podstawowych produktów chemii nieorganicznej.
ric-graphite=Złoże grafitu; surowiec do produkcji węgla technicznego, materiałów ogniotrwałych i materiałów dla elektroniki.
ric-bauxite=Złoże boksytu; surowiec do produkcji aluminium.
ric-borax=Złoże boraksu; surowiec dla przemysłu szklarskiego, ceramicznego i chemii specjalistycznej.
ric-fluorite=Złoże fluorytu; surowiec na topniki i do specjalistycznej produkcji kwasów.
ric-apatite=Złoże apatytu; surowiec do produkcji fosforanów i nawozów sztucznych.
ric-sylvite=Złoże sylwinu; źródło soli potasowych i surowiec do produkcji nawozów.
ric-kaolin=Złoże kaolinu; surowiec dla przemysłu ceramicznego i do produkcji materiałów izolacyjnych.
ric-baghouse-filter=Filtr workowy usuwający pył lotny i pyły hutnicze z ochłodzonych przemysłowych gazów spalinowych przed procesem mokrego oczyszczania. 
ric-wet-scrubber=Wykorzystuje zawiesinę wapienną i wymienne złoża sorpcyjne do usuwania zanieczyszczeń siarkowych ze spalin, z których wcześniej usunięto pyły.
ric-primary-clarifier=Oddziela zawiesinę ciał stałych ze ścieków przemysłowych, tworząc osad denny nadający się do przepompowywania oraz klarowny odciek.
ric-sludge-filter-press=Mechanicznie odwadnia zawiesinę osadową, tworząc placek filtracyjny i zawracając klarowną ciecz do obiegu oczyszczania.

