[item-description]
ric-electrical-contact=Tłoczony element stykowy stosowany we wczesnych systemach logistycznych i obwodach.
ric-insulating-board=Prymitywna płyta izolacyjna, używana przed erą właściwej produkcji elektroniki.
ric-primitive-circuit-board=Prosta płytka umożliwiająca tworzenie pierwszych obwodów elektronicznych.
ric-industrial-components=Standardowe elementy mechaniczne i elektryczne do pierwszych maszyn i badań.
ric-machine-frame=Rama konstrukcyjna wyznaczająca przejście od maszyn budowanych ręcznie do maszyn przemysłowych.
ric-pig-iron=Surówka żelaza z wielkiego pieca, półprodukt do odlewania płyt żeliwnych lub produkcji kęsów stalowych.
ric-blister-copper=Zanieczyszczona miedź surowa (typu blister), półprodukt do odlewania przemysłowych płyt miedzianych.
ric-steel-billet=Półprodukt stalowy (kęs) przeznaczony do walcowania na płyty stalowe.
ric-hematite-lump-ore=Gruboziarnista ruda hematytowa, odpowiednia do wzbogacania na sucho.
ric-hematite-fines=Drobna frakcja hematytu, wymagająca płukania na mokro.
ric-magnetite-lump-ore=Gruboziarnista ruda magnetytowa, odpowiednia do wzbogacania na sucho.
ric-magnetite-fines=Drobna frakcja magnetytu, wymagająca płukania na mokro.
ric-chalcopyrite-lump-ore=Gruboziarnista ruda siarczku miedzi (chalkopiryt), odpowiednia do wzbogacania na sucho.
ric-chalcopyrite-fines=Drobna frakcja siarczku miedzi, odpowiednia do flotacji.
ric-bornite-lump-ore=Gruboziarnista ruda siarczku miedzi bogata w bornit.
ric-bornite-fines=Drobna frakcja bogata w bornit, odpowiednia do flotacji.
ric-malachite-lump-ore=Gruboziarnista ruda miedzi bogata w malachit.
ric-malachite-fines=Drobna frakcja malachitu, odpowiednia do flotacji.
ric-iron-sinter=Spiek żelazny – surowiec do redukcji wielkopiecowej.
ric-copper-sulfide-froth=Odzyskana piana flotacyjna zawierająca miedź.
ric-copper-matte=Kamień miedziowy – półprodukt z wytopu siarczku miedzi, wymagający konwertowania do miedzi surowej.
ric-beneficiation-sludge=Mokry szlam z procesu wzbogacania rudy, wymagający sedymentacji w instalacji oczyszczania odpadów. 
ric-petroleum-coke=Bogaty w węgiel produkt uboczny procesu koksowania opóźnionego w rafinerii; przydatny jako gęste paliwo pośrednie.
ric-asphalt-binder=Ciężkie spoiwo budowlane na bazie bitumu, odzyskiwane z pozostałości procesowych rafinerii.
ric-spent-hydrotreater-catalyst=Zużyty i zanieczyszczony katalizator z procesu hydrorafinacji olejów napędowych; metale można z niego odzyskać w procesie recyklingu.
ric-metallurgical-flux=Mieszanka topników (wapno i fluoryt) stosowana przy rafinacji stali, miedzi i stopów.
ric-direct-reduced-iron=Koncentrat żelaza zredukowany wodorem i tlenkiem węgla, przeznaczony do procesu produkcji stali metodą tlenową.
ric-basic-oxygen-steel=Półprodukt stalowy z procesu konwertorowego (tlenowego), odlewany w postaci wlewków płaskich (slabów) przed walcowaniem.
ric-steel-slab=Półwyrób stalowy (wlewki płaskie) z odlewania ciągłego, przeznaczony do walcowania na blachy grube i cienkie.
ric-steel-sheet=Płaski wyrób stalowy stosowany do produkcji kształtowanych ram i późniejszych elementów maszyn.
ric-formed-steel-frame=Rama wykonana z blachy stalowej, płyt stalowych i elementów łączących.
ric-fire-refined-copper=Miedź surowa (typu blister) oczyszczona metodą rafinacji ogniowej (utleniania) przed odlaniem lub walcowaniem.
ric-copper-sheet=Płaski wyrób miedziany stosowany w elektronice, stykach oraz do produkcji elementów kształtowanych.
ric-aluminium-extrusion=Lekki profil konstrukcyjny z aluminium, stosowany w ramach i lekkich konstrukcjach.
ric-light-alloy-structural-panel=Kształtowany panel ze stopu lekkiego, przeznaczony do zaawansowanych konstrukcji infrastrukturalnych i technologii kosmicznych.
ric-glass-fibre-composite-panel=Panel kompozytowy z włókna szklanego i aluminium, łączony żywicą epoksydową, stosowany w lekkich konstrukcjach.
ric-refractory-lining=Wymienna wykładzina ogniotrwała do urządzeń pracujących w wysokich temperaturach i środowisku korozyjnym.
ric-titanium-sheet=Walcowany wyrób tytanowy, stosowany w zaawansowanych technicznie urządzeniach i infrastrukturze.
ric-steelmaking-charge=Przygotowany wsad do konwertera tlenowego, zawierający surówkę żelaza, żelazo redukowane bezpośrednio oraz topniki.
ric-mill-scale=Zgorzelina (tlenek żelaza) powstająca podczas walcowania na gorąco; możliwa do odzyskania poprzez trawienie kwasem i przetwarzanie odpadów.
ric-copper-anode-slime=Osad anodowy (szlam) zawierający metale szlachetne, powstający podczas elektrolitycznej rafinacji miedzi.
ric-metallurgical-dust=Drobny pył powstający podczas odlewania i obróbki metali w wysokich temperaturach.
ric-waste-filter-cake=Osad stały (placek filtracyjny) z wstępnego klarowania ścieków i oczyszczania strumieni odpadów płynnych.
ric-neutralised-sludge=Osad powstały w wyniku neutralizacji kwaśnych cieczy i zużytych roztworów trawiących.
ric-recovered-metal-concentrate=Koncentrat metali o niższej zawartości, odzyskany z pyłów hutniczych i mieszanych strumieni odpadów.
ric-mineral-residue=Stabilna pozostałość mineralna z przetworzonego placka filtracyjnego, popiołu i osadów.
ric-sulfur-sorbent-cake=Zużyty sorbent bogaty w siarkę, pochodzący z oczyszczania gazów spalinowych i systemów płuczących (skruberów). 
ric-carbon – rafinowany węgiel przemysłowy wytwarzany z koksu, przeznaczony do zastosowań w chemii azotanów, produkcji materiałów wybuchowych, procesach redukcji oraz dalszych etapach przetwarzania węgla.

ric-crusher=Węglowa kruszarka wstępna; przetwarza rudy, kamień i węgiel na rozdrobniony surowiec. Zbuduj ją jako pierwszą.
ric-ore-sorter=Maszyna do suchej obróbki; sortuje standardowe rudy i kamień na właściwe rudy, minerały oraz wstępne koncentraty.
ric-ore-washer=Maszyna do obróbki na mokro; płucze rozdrobnione rudy i drobne frakcje, uzyskując czystsze koncentraty oraz odpady stałe i ciekłe.
ric-flotation-cell=Urządzenie do wzbogacania siarczków (technologia zielonej nauki); koncentruje drobne frakcje miedzi i pianę flotacyjną przed dalszymi procesami hydrometalurgicznymi.
ric-coke-oven=Piec koksowniczy; przetwarza węgiel (lub jego drobne frakcje) na koks, smołę węglową i gaz opałowy, zasilając wczesne etapy metalurgii i petrochemii.
ric-blast-furnace=Wielki piec; podstawowe urządzenie wczesnej metalurgii do produkcji surówki żelaza, kamienia miedziowego, żużla i wsadu stalowniczego.
ric-sintering-plant=Spiekalnia; przetwarza drobny koncentrat żelaza na spiek, zapewniając wielkiemu piecowi odpowiedni wsad żelazny.
ric-casting-machine=Odlewnia; formuje surówkę żelaza i miedź surową (typu blister) w standardowe płyty na wczesnym etapie produkcji metali.
ric-rolling-mill=Walcarka; kształtuje kęsy stalowe oraz późniejsze płyty i arkusze metalu w gotowe elementy i półprodukty przemysłowe.
ric-waste-treatment-plant=Zakład utylizacji odpadów; przetwarza odpady stałe, żużel, wody kwaśne i zneutralizowane ścieki, zapobiegając przestojom wczesnego przemysłu.
ric-chemical-reactor=Reaktor chemiczny ogólnego przeznaczenia; służy do wczesnych procesów chemii nieorganicznej, neutralizacji, pracy z kwasami i reakcji pośrednich.
ric-air-separator=Separator powietrza; rozdziela powietrze na tlen i azot na potrzeby metalurgii, przetwórstwa siarki i późniejszej chemii wysokociśnieniowej.
ric-electrolyzer=Elektrolizer; urządzenie elektrochemiczne do elektrolizy wody, solanki, procesów chlorowo-alkalicznych, produkcji fluoru i późniejszych zaawansowanych metod elektrolitycznych.
ric-roaster=Piec prażalniczy; piec utleniający do koncentratów siarczkowych i procesów chemii mineralnej wymagających obsługi gazowych lub kwaśnych produktów ubocznych.
ric-distillation-column=Kolumna destylacyjna; urządzenie do frakcjonowania ropy naftowej, smoły węglowej, nafty, gazu opałowego i ciężkich pozostałości.
ric-electrowinning-cell=Wanna elektrolityczna; urządzenie hydrometalurgiczne do odzyskiwania metali w postaci katod z roztworów siarczanowych lub ługów. 
ric-vacuum-distillation-column=Zaawansowana kolumna rafineryjna do przerobu ciężkich pozostałości i frakcjonowania próżniowego, stosowana po etapie destylacji podstawowej.
ric-delayed-coker=Zaawansowana instalacja rafineryjna do koksowania opóźnionego, przekształcająca pozostałość próżniową w koks naftowy oraz lżejsze strumienie produktów.
ric-hydrotreater=Zaawansowany reaktor ciśnieniowy służący do usuwania siarki i uzyskiwania czystszych frakcji rafineryjnych.
ric-catalytic-reformer=Zaawansowana instalacja katalityczna do produkcji reformatu i związków aromatycznych.
ric-steam-cracker=Zaawansowane urządzenie petrochemiczne do krakingu olejów napędowych i lekkich węglowodorów na surowce do produkcji polimerów.
ric-cleanroom-assembler=Urządzenie montażowe pracujące w kontrolowanym środowisku, przeznaczone do płytek drukowanych, półprzewodników, płytek krzemowych i precyzyjnej elektroniki.
ric-catalytic-reactor=Reaktor katalityczny do procesów takich jak synteza amoniaku, metanolu i nadtlenków, reforming oraz produkcja chemikaliów specjalistycznych.
ric-high-pressure-reactor=Wysokociśnieniowy reaktor procesowy przystosowany do syntezy i uwodorniania pod wysokim ciśnieniem.
ric-advanced-distillation-column=Wydajna kolumna rozdzielająca do zaawansowanych frakcji chemicznych i rafineryjnych.
ric-advanced-electrochemical-cell=Zaawansowane urządzenie elektrochemiczne do procesów elektrolizy i elektrorafinacji wysokiej klasy.

ric-baghouse-filter-media = Wymienne ceramiczne wkłady filtracyjne z materiałem nośnym o właściwościach izolacyjnych, stosowane do wychwytywania cząstek stałych z przemysłowych gazów odlotowych.

ric-baghouse-filter=Specjalistyczny filtr workowy do usuwania pyłów ze schłodzonych przemysłowych gazów spalinowych.
ric-wet-scrubber=Specjalistyczny absorber mokry do oczyszczania gazów spalinowych zawierających związki siarki, stosowany po etapie usuwania pyłów.
ric-primary-clarifier=Osadnik służący do rozdzielania ścieków na oczyszczony odciek górny oraz zagęszczony osad denny.
ric-sludge-filter-press=Urządzenie do mechanicznego odwadniania, przekształcające zawiesinę osadową w placek filtracyjny.

[fluid-description]
ric-lubricant=Środek smarny Industrial Alchemy wytwarzany z ciężkich pozostałości rafineryjnych, stosowany przez należące do RIC sieci obsługi silników i maszyn.
ric-treated-effluent=Częściowo oczyszczone ścieki przemysłowe, które wymagają doczyszczenia przed ponownym wykorzystaniem jako czysta woda.

ric-particulate-flue-gas=Schłodzone spaliny zawierające popiół lotny oraz drobne cząstki stałe zawierające metale.
ric-sludge-slurry=Pompowalny osad denny z osadnika, zawierający zagęszczone zawiesiny.

[recipe-category-description]
ric-ore-sorting=Przygotowanie i separacja suchych materiałów sypkich: rud oraz strumieni minerałów.
ric-crushing=Mechaniczne rozdrabnianie rud, minerałów, węgla i ciał stałych w procesach technologicznych.
ric-washing=Mycie na mokro i przygotowanie zawiesin z zanieczyszczonych rud oraz minerałów.
ric-flotation=Flotacja siarczków i minerałów z użyciem wody i odczynników oraz obsługa koncentratu.
ric-coking=Przetwarzanie węgla, koksu naftowego i surowców bogatych w węgiel w piecach koksowniczych.
ric-roasting=Utlenianie lub obróbka termiczna rud siarczkowych i reaktywnych koncentratów.
ric-sintering=Aglomeracja drobnoziarnistych rud, pyłów i wsadów hutniczych przed procesem piecowym.
ric-blast-furnace=Wysokotemperaturowa redukcja rud i wsadów hutniczych.
ric-oxygen-converting=Rafinacja stali i wysokowydajne przetwórstwo hutnicze z użyciem tlenu.
ric-casting=Odlewanie ciekłego metalu w postaci wlewków, kęsów, kęsisk, płyt lub półproduktów.
ric-rolling=Mechaniczne walcowanie i kształtowanie kęsisk, kęsów oraz blach.
ric-extrusion=Mechaniczne wyciskanie i kształtowanie ciśnieniowe specjalistycznych wyrobów metalowych.
ric-electrowinning=Elektrochemiczny odzysk i rafinacja rozpuszczonych metali.
ric-waste-treatment=Neutralizacja, klarowanie, filtracja i odzysk materiałów ze strumieni odpadów.
ric-chemistry=Ogólne przemysłowe procesy chemiczne realizowane w reaktorze chemicznym.
ric-chemical-reactor=Specjalistyczny proces w reaktorze chemicznym (nazwa zachowana dla kompatybilności i przyszłych modyfikacji).
ric-electrolysis=Rozkład elektrolityczny oraz produkcja elektrochemiczna (np. metoda chlorowo-alkaliczna).
ric-air-separation=Rozdzielanie powietrza na tlen, azot i powiązane strumienie gazowe.
ric-distillation=Frakcjonowanie i destylacja ciekłych lub gazowych strumieni procesowych.
ric-catalysis=Przemiany chemiczne katalizowane w urządzeniach do procesów katalitycznych.
ric-high-pressure-chemistry=Reakcje chemiczne pod wysokim ciśnieniem (zaawansowana synteza i hydroprzetwarzanie).
ric-cleanroom-electronics=Produkcja elektroniki i półprzewodników w warunkach czystych (z wykorzystaniem pomieszczeń typu cleanroom).
ric-hydrotreating=Obróbka wodorowa frakcji rafineryjnych i zanieczyszczonych strumieni petrochemicznych. 
ric-catalytic-reforming=Katalityczny proces uszlachetniania w rafinerii i wytwarzanie reformatu.
ric-steam-cracking=Wysokotemperaturowy kraking strumieni węglowodorów z użyciem pary wodnej.
ric-delayed-coking=Termiczna konwersja ciężkich pozostałości na koks i lżejsze strumienie rafineryjne.
ric-vacuum-distillation=Niskociśnieniowe frakcjonowanie ciężkich pozostałości olejowych i pozostałości rafineryjnych.
ric-advanced-distillation=Zaawansowana destylacja i precyzyjne frakcjonowanie w nowoczesnych instalacjach procesowych.
ric-advanced-electrochemistry=Zaawansowane procesy elektrochemiczne w specjalistycznych, nowoczesnych instalacjach.

# 0.9.32 Recipe Book organization notes
ric-vanilla-compat = Zbiorcze oznaczenie kompatybilności z RIC

ric-particulate-control=Sucha filtracja schłodzonych gazów spalinowych w celu usunięcia popiołu lotnego i drobnego pyłu zawierającego metale.
ric-flue-gas-scrubbing=Mokra absorpcja i regeneracja sorbentu w procesie oczyszczania przemysłowych gazów spalinowych zawierających związki siarki.
ric-water-clarification=Grawitacyjne rozdzielanie i doczyszczanie ścieków przemysłowych z podziałem na oczyszczony odciek oraz osad.
ric-sludge-dewatering=Mechaniczne rozdzielanie fazy ciekłej i stałej oraz suszenie zagęszczonego osadu przemysłowego.
