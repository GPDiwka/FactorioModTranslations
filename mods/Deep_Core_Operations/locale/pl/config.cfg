drg_mission_hacking_facility_tooltip2=Główny obiekt jest zamknięty. Zlokalizuj zdalny terminal, zhakuj go i odzyskaj kartę dostępu niezbędną do uzyskania dostępu.
drg_hacking_facility_tooltip_1=\n[color=#6dfd99]Bonus: odzyskane dane hakerskie z Biomów 1-3 dostarczają cennych wskazówek dotyczących sekwencji bezpieczeństwa tego terminala.[/color]
drg_hacking_facility_tooltip_2=\n[color=#6dfd99]Bonus: odzyskane dane hakerskie z Biomów 4-6 dostarczają cennych wskazówek dotyczących sekwencji bezpieczeństwa tego terminala.[/color]
drg_hacking_facility_tooltip_3=\n[color=#6dfd99]Bonus: odzyskane dane hakerskie z Biomów 7-8 dostarczają cennych wskazówek dotyczących sekwencji bezpieczeństwa tego terminala.[/color]
drg_mission_invading_facility=Dotrzyj do zainfekowanej placówki
drg_mission_invading_facility_tooltip=Dotrzyj do zainfekowanego obiektu, korzystając z klawiatur dostępu
drg_mission_invading_facility_tooltip2=Główny obiekt jest zamknięty drzwiami antywłamaniowymi. Zniszcz zewnętrzne ściany za pomocą zbiornika wiertniczego, a gdy już znajdziesz się w środku, użyj kart dostępu, aby wejść do obiektu. Nie wiadomo, co kryje się w środku, ale obiekt jest opanowany przez wrogie stworzenia.


drg_mission_scan_cave_tooltip=Zeskanuj kluczowe punkty jaskini, aby uzyskać dane geologiczne.
drg_mission_drill_tooltip=Przewierć się przez lite ściany jaskini, aby dotrzeć do cennych kryształów (Shard Crystal).
drg_mission_rescue_mule_tooltip=Odzyskaj zagubione jednostki M.U.L.E.
drg_mission_hacking_tooltip=Przejmij kontrolę nad wrogimi systemami i zabezpiecz je.
drg_mission_mine_liquid_tooltip=Wydobądź cenne płyny z podziemi.
drg_mission_rare_minerals_tooltip=Wydobądź rzadkie i bardzo cenne minerały.
drg_mission_deep_core_mining_tooltip=Zlokalizuj i napraw wielki ekstraktor głębinowy (Big Deep Core Extractor) i uruchom go!
drg_mission_explore_cave_tooltip=Eksploruj jaskinię, otwierając przejścia.
drg_mission_explore_cave_tooltip2=Eksploruj jaskinię, otwierając przejścia i odkrywając rozległe komnaty. Kop dalej!
drg_mission_mining_tooltip2=Do ukończenia misji liczą się tylko minerały zebrane przez M.U.L.E. Jednostka ta automatycznie zbiera rudę z pobliskich skrzyń. Po udanym wydobyciu wszystkie zebrane surowce są przesyłane do wewnętrznego magazynu Stacji Kosmicznej (Space Rig).
drg_main_mission_mining_tooltip2=\n[color=#6dfd99]Bonus: dostarcza tę rudę bezpośrednio do Stacji Kosmicznej co minutę po ukończeniu wymaganych misji: [virtual-signal=signal-stack-size]Wydobycie głębinowe lub Dostawa paliwa do pociągu[/color]
drg_mission_killing_tooltip2=Przekop się przez jaskinię, aby zlokalizować głównego wroga. Gdy go znajdziesz, wyeliminuj go, by ukończyć misję.
drg_mission_pest_control_tooltip=Zniszcz wrogie siedliska.
drg_mission_pest_control_tooltip2=Zabij określoną liczbę jednostek wroga, wieżyczek lub punktów odrodzenia. 
drg_mission_underground_production_tooltip=Wytwarzaj przedmioty w jaskini
drg_mission_rescue_imprisoned_miners_tooltip=Uratuj uwięzionych górników z jaskini
drg_mission_charge_generator_tooltip=Znajdź generator, napraw go i w pełni naładuj
drg_mission_scan_cave_tooltip2=Zbuduj radary w 3 wyznaczonych miejscach i utrzymuj je w stanie gotowości. Każdy radar musi wykonać 10 skanów.\n[color=#6dfd99]Bonus: umożliwia sprawdzenie modyfikatorów lub wydarzeń w jaskini za pomocą terminala misji przed zejściem na dół.[/color]
drg_mission_drill_tooltip2=Wiertarka wymaga do działania [item=coal] (węgla), który musisz znaleźć w jaskini. Pozostań w jej zasięgu operacyjnym, mając węgiel w ekwipunku, a maszyna ruszy w stronę Kryształu Odłamkowego (Shard Crystal). Gdy dotrze do celu, dostarczaj jej paliwo, by przewierciła się przez kryształ i go zniszczyła, kończąc tym samym misję. Uwaga: Gracze nie mogą kopać przed wiertarką. Trzymaj się blisko i oczyszczaj drogę w miarę jej postępów.
drg_mission_rescue_mule_tooltip2=Odszukaj w jaskini 4 zagubione jednostki M.U.L.E. Napraw je i eskortuj z powrotem do kapsuły desantowej w celu ewakuacji.\n[color=#6dfd99]Bonus: pozwala jednostce M.U.L.E. samodzielnie wydobywać złoża rudy.[/color]
drg_mission_hacking_tooltip2=Konkurencyjna firma porzuciła kapsułę desantową po nieudanej misji. Połącz ją z rozstawionym terminalem hakerskim za pomocą zielonych kabli, aby włamać się do systemu i zabezpieczyć cenne dane oraz zasoby znajdujące się w środku.\n[color=#6dfd99]Bonus: ujawnia kody, które mogą pomóc w przyszłych misjach hakerskich.[/color]
drg_mission_mine_liquid_tooltip2=Zlokalizuj i napraw 3 ekstraktory płynu w jaskini. Po aktywacji zaczną one pompować cenny płyn. Zbuduj rurociągi łączące je z wyrzutnią ładunku płynu, napełnij płynem beczki i załaduj wyrzutnię. Będziesz potrzebować [img=item/barrel]beczek. Wystrzel ładunek, aby ukończyć misję.\n[color=#6dfd99]Bonus: pozwala zbudować dodatkowy [img=entity/drg_orbital_fluid_uplink]przekaźnik płynu (fluid uplink).[/color]
drg_mission_rare_minerals_tooltip2=W całej jaskini rozsiane są złoża rzadkich minerałów. Kop, aby znaleźć błyszczące skały i wydobądź je kilofem. Pamiętaj, że do ukończenia misji liczą się tylko minerały zebrane przez Muła, więc umieszczaj je w pobliskich skrzyniach przeznaczonych dla niego.
drg_mission_deep_core_mining_tooltip2=Zlokalizuj i uruchom ponownie porzucony Ekstraktor Głębokiego Rdzenia (Big Deep Core Extractor), ukryty głęboko w jaskiniach. Przywróć maszynę do działania, używając [img=item/engine-unit]jednostek napędowych, [img=item/advanced-circuit]zaawansowanych układów scalonych i [img=item/iron-gear-wheel]kół zębatych.\n[color=#6dfd99]Bonus: stanowi warunek wstępny[virtual-signal=signal-stack-size] dla pasywnego transportu rudy do Stacji Kosmicznej (Space Rig).[/color]
drg_mission_train_fuel_delivery_tooltip=Zbuduj linię kolejową, aby dostarczyć paliwo do Ekstraktora Głębokiego Rdzenia.
drg_mission_train_fuel_delivery_tooltip2=Ekstraktor Głębokiego Rdzenia wymaga paliwa do działania. Musisz zbudować linię kolejową i przetransportować [fluid=drg_fluid_gasola] przez niebezpieczną jaskinię. Spraw, by maszyna znów ruszyła! Istnieje tajemniczy związek między ekstraktorem a pociągiem – maszyna działa tylko wtedy, gdy pociąg znajduje się w pobliżu.\n[color=#6dfd99]Bonus: stanowi warunek wstępny[virtual-signal=signal-stack-size] dla pasywnego transportu rudy do Stacji Kosmicznej (Space Rig).[/color]
drg_mission_car_power_delivery_tooltip=Napraw pojazd, podjedź nim do kryształu energii, a następnie do rakiety.
drg_mission_car_power_delivery_tooltip2=Konkurencyjna firma porzuciła silos rakietowy głęboko w tym systemie jaskiń. Raporty wywiadu wskazują, że wciąż znajdują się tam cenne, zaszyfrowane dane – a my zamierzamy je wykraść. Ich systemy bezpieczeństwa zasilane są tajemniczym źródłem energii, pozyskiwanej z pobliskiego [img=entity/drg_crystal_blue]kryształu. Do transportu tej energii opracowali specjalistyczny pojazd, zdolny do ładowania się bezpośrednio z kryształu. Znajdź uszkodzony pojazd, napraw go, podjedź do [img=entity/drg_crystal_blue]kryształu, aby naładować jego rdzeń, a następnie dostarcz zgromadzoną energię do silosu rakietowego, by odblokować skarbiec danych.
drg_mission_platform_core_tooltip=Odzyskaj unikalny artefakt, aby ulepszyć Stację Kosmiczną
drg_mission_platform_core_tooltip2=Wyrusz w głąb systemu jaskiń i odszukaj zaginioną placówkę montażową rdzeni. Broń tego miejsca i dostarcz wymagane surowce do starożytnej maszyny. W zamian wytworzy ona unikalny artefakt, który pozwoli rozszerzyć możliwości Stacji Kosmicznej i odblokować nowe technologie.
