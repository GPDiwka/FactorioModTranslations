[entity-description]
super-boss-zombie-spawner=[color=#fd7979]Zwykła broń nie robi na nim wrażenia.[/color]\nTo, co znajdowało się wewnątrz tego kadłuba, wciąż żyło, gdy wokół niego wznoszono placówkę. Każde gniazdo po tej stronie muru wywodzi się z tego źródła, które będzie tworzyć kolejne, dopóki sama struktura pozostanie nienaruszona. Tylko antygen wytworzony z wywołanej przez nie infekcji jest w stanie przebić jego pancerz.
drg_asteroid-collector=[color=#e597f0]Ograniczenie: dozwolona tylko jedna sztuka do momentu opracowania technologii [technology=rocket-silo].[/color]
drg_crusher=[color=#e597f0]Ograniczenie: dozwolona tylko jedna sztuka do momentu opracowania technologii [technology=rocket-silo].[/color]
drg_freeze_chest=Spowalnia psucie się zawartości
drg_mission_silo=Ta rakieta zostanie wystrzelona do Stacji Kosmicznej, gdy wypełni się cennymi płynami.
drg_drop_pod_hack_mission=Wygląda na to, że kapsuła desantowa konkurencji uległa awarii i została tu porzucona. Można ją zhakować, aby odzyskać cenne dane i surowce. Podłącz ją do [entity=drg_hacking_terminal] za pomocą zielonych kabli obwodowych, aby rozpocząć proces hakowania.
drg_hacking_terminal=Ten terminal umożliwia włamywanie się do wrogich systemów podczas misji hakowania. Naładuj go energią i połącz terminal z docelową kapsułą desantową za pomocą zielonych kabli obwodowych.
drg_broken_lab=Napraw ten artefakt, dostarczając wymagane materiały, aby odzyskać jego zawartość.
drg_mule_broken=Wygląda na to, że twój MULE został zniszczony. Kliknij, aby wyświetlić panel naprawy.
drg_rescue_mule_broken=To uszkodzony MULE starego typu. Kliknij, aby wyświetlić panel naprawy.
drg_platform_linked_chest=Przesyła przedmioty między zewnętrzną platformą a wnętrzem Stacji Kosmicznej.
drg_platform_linked_chest_2=Przesyła przedmioty między zewnętrzną platformą a wnętrzem Stacji Kosmicznej. 
drg_supply_chest=Przechowywane tu przedmioty można wysłać ze Stacji Kosmicznej na misję podziemną za pomocą zdalnego sterowania.
drg_mule_fluid_collector=Zgromadzony tu płyn zostanie odebrany przez MULE i przetransportowany na Stację Kosmiczną podczas ewakuacji.
drg_driller_machine=Ta maszyna wiertnicza do działania wymaga [item=coal]węgla. Pozostań w pobliżu obszaru jej pracy, mając węgiel w ekwipunku. Uwaga: Gracze nie mogą kopać przed maszyną.
drg_mission_terminal=Służy do wyboru misji i przygotowania procedury startu kapsuły desantowej. Połączony z siecią Platform Hub.

drg_mule_chest=Dostarcza zasoby zgromadzone na Stacji Kosmicznej, zebrane przez MULE-a podczas podziemnych prac wydobywczych. Kliknij, aby uzyskać dostęp do zapasów Stacji Kosmicznej.
drg_orbital_fluid_uplink=Urządzenie to umożliwia przesyłanie płynów ([fluid=water][fluid=crude-oil][fluid=heavy-oil][fluid=ammoniacal-solution][fluid=lithium-brine][fluid=fluorine]) z jaskiń na Stację Kosmiczną. Instalacja przekaźnika wymaga wcześniejszego ukończenia misji „Wydobycie płynów” w danym regionie planety. W ramach jednej misji w jaskini dozwolone jest użycie tylko jednego takiego urządzenia.
drg_energy_receiver=Odbiera energię ze Stacji Kosmicznej. Liczba przekaźników jest ograniczona przez ulepszenia wynikające z badań.



