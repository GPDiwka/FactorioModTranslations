[space-location-description]
drg-biome-nauvis=Centralna strefa wydobywcza i główny węzeł operacyjny. Stosunkowo stabilny obszar podziemny z istniejącą infrastrukturą i drogami dostępu do głębszych warstw. Na obrzeżach występuje typowa wroga fauna. Choć nie dominuje tu żaden konkretny surowiec, można tu znaleźć wszystkie rzadkie minerały, choć w bardzo niskich stężeniach.
drg-biome-desert=Spękane, suche jaskinie, w których przeważają kruche skały i głębokie szczeliny. Teren jest niestabilny; podczas prac wydobywczych często dochodzi do powstawania kieszeni pyłowych i zawalania się stropów. Pod powierzchnią czają się rodzime drapieżne pajęczaki, atakujące z ukrytych tuneli. W skałach można natrafić na odsłonięte złoża fragmentów perlitu oraz rzadsze ślady bloków amberium.
drg-biome-vulcanus=Niestabilna sieć tuneli rozgrzanych magmą, gdzie środowisko kształtowane jest przez ekstremalną temperaturę i ciśnienie. Jaskinie rozświetlają rzeki płynnej skały, a aktywność sejsmiczna jest tu częstym zjawiskiem. W głębinach tych żyją wybuchowe gryzaki (Explosive Biters), które z niszczycielską siłą szarżują na intruzów. Głęboko w najgorętszych strefach znajdują się bogate żyły ferronoksu.
drg-biome-gleba=Jaskinie te opanowała gęsta podziemna roślinność, tworząc potężne systemy korzeniowe i bogate w minerały warstwy organiczne. Bujna roślinność ogranicza widoczność, a pod wpływem nacisku teren może ulegać przemieszczeniom. Obszaru strzegą pentapody i deptacze (Stompers) – stworzenia terytorialne i niezwykle wytrzymałe. Biom ten jest głównym źródłem bloków amberium, powstających wewnątrz organiczno-mineralnej matrycy.
drg-biome-aquilo=Zamarznięte tunele wydrążone w grubych warstwach lodu i formacjach krystalicznych. Światło załamuje się na ścianach z kryształu, jednak ekstremalne zimno spowalnia ruchy. Korytarze te przemierzają lodowe gryzaki (Frost Biters), zdolne zamrażać cele i maszyny. W warstwach lodu często spotyka się duże złoża fragmentów perlitu.
drg-biome-fulgora=Jaskinie naładowane elektrycznie, przez które nieustannie przeskakują wyładowania energii. Powietrze przesycone jest ładunkami elektrostatycznymi, co często powoduje zakłócenia w pracy maszyn. Strefy te patrolują starożytne, autonomiczne droidy – pozostałość po zaginionej cywilizacji – wyróżniające się dużą wytrzymałością i precyzją. Niestabilne pola energetyczne sprzyjają powstawaniu złóż spikitu, który trzeszczy od zgromadzonego ładunku. 
drg-biome-toxic=Skorodowane i toksyczne systemy tuneli wypełnione gęstymi pomieszczeniami gazowymi i reaktywnymi minerałami. Widoczność jest słaba, a długotrwała ekspozycja jest niebezpieczna. Toksyczne gryzonie żyją tutaj, uwalniając trujące chmury podczas walki. Głównym surowcem jest radiantit, lotny minerał, który emituje szkodliwą energię i zanieczyszcza okoliczne tereny.
drg-biome-zombie=Sklasyfikowany podziemny kompleks badawczy, zakopany głęboko pod spękaną planetą. Kiedyś najnowocześniejszy ośrodek naukowo-przemysłowy, obecnie stoi w ciszy i opuszczony po katastrofalnej epidemii. W jego głębinach wciąż kryją się zaawansowane laboratoria, zautomatyzowane linie produkcyjne i tajemnicze technologie eksperymentalne. Obiekt jest opanowany przez zainfekowany personel i wrogie, bioinżynieryjne stworzenia, przez co każdy korytarz zamienia się w śmiertelną pułapkę. Wszelkie sekrety, które wciąż kryją się za jego wzmocnionymi drzwiami, mogą zmienić przyszłość platformy kosmicznej — jeśli ktokolwiek przetrwa wystarczająco długo, aby je odkryć.


