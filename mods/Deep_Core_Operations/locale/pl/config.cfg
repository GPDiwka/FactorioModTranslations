drg_infected_promethium_lethal=Promet wypala twój kombinezon! Nie można go przenosić w rękach – użyj taśmociągów lub robotów.

drg_analysis_intro_text=> STANOWISKO ANALIZY STRUKTURALNEJ – GOTOWOŚĆ\n> Archiwum placówki zawiera pozostałości badań nad izolacją prometu. Konsola potrafi je odtworzyć, ale skanowanie wymaga użycia żywych próbek, a samo archiwum jest zabezpieczone blokadą jednorazowego dostępu.\n> Załaduj __1__ komorę izolacyjną i __2__ karty dostępu poziomu 1, aby rozpocząć. Żaden z tych przedmiotów nie przetrwa procesu.
drg_analysis_start=Rozpocznij analizę
drg_analysis_started=Rozpoczęto analizę strukturalną. Terminal pobiera ogromne ilości energii – spodziewaj się gości.
drg_analysis_running_text=> TRWA ANALIZA\n> Sekwencjonowanie sieci izolacyjnej... nie przerywaj zasilania.\n> Coś w placówce wykryło pobór energii.
drg_analysis_progress=Rekonstrukcja: __1__%
drg_analysis_done_text=> ANALIZA ZAKOŃCZONA\n> Procedura izolacji odzyskana. Promet można teraz bezpiecznie przetwarzać.\n\n> Układ sieci nie był przypadkowy. Infekcja została celowo wprowadzona – a jej źródło znajdowało się gdzieś powyżej.\n> Odczytywanie logów badawczych... [color=#6dfd99]ODZYSKANO UKRYTE WSPÓŁRZĘDNE[/color]\n> [space-location=drg_promethium_asteroids] Pas nietkniętego prometu na orbicie tej planety, usunięty ze wszystkich map. To jest źródło. To właśnie wydobywano tu po cichu.\n\n> Udaj się do punktu ewakuacji. Współrzędne są bezużyteczne, jeśli zginiesz tu na dole razem z nimi.
drg_antigen_nest_vulnerable=Antygen znajduje się wewnątrz. Powłoka pęka – teraz można to uszkodzić.\nUtrzymaj przepływ. Każda wprowadzona dawka wypala to od środka; nic, co masz przy sobie, nie zadaje mu większych obrażeń niż jego własna trucizna.
drg_antigen_dose=Dostarczono dawkę antygenu __1__ z __2__.
drg_facility_heart_killed=Źródło infekcji w placówce zostało zlikwidowane. Proces namnażania ustał i po raz pierwszy, odkąd wiertnica przebiła się przez ścianę, w korytarzach panuje cisza – nie słychać chrobotania za drzwiami ani chlupotania w szybach wentylacyjnych. Wszystko, co personel tu hodował, zdechło wraz z tym stworzeniem. Misja zakończona. Czas się ewakuować: wezwij transport i załaduj Muła do kapsuły. Wiedza zdobyta w tym miejscu nie ma żadnej wartości, dopóki nie wydostanie się stąd razem z tobą.
drg_facility_victory=Kapsuła oddaliła się od ściany, a odczyty są stabilne. To, co oddychało pod tą placówką, już nie żyje; po raz pierwszy głębokie warstwy gruntu to tylko zwykła skała. Operacja w głębokich pokładach zakończona, kontrakt zamknięty. Stacja należy do ciebie – znajdź coś innego, co warto wydobyć.
drg_promethium_analysis_complete=Analiza strukturalna zakończona! Rejestry z badań zawierały coś więcej niż tylko procedury zabezpieczające – ukryte współrzędne, usunięte ze wszystkich map: [space-location=drg_promethium_asteroids] pas czystego prometu na orbicie tej planety. To stamtąd pochodziła infekcja i to właśnie ten surowiec po cichu wydobywała placówka. Wycofaj się do punktu ewakuacji – gdy tylko Stacja Kosmiczna otrzyma te współrzędne, będzie mogła tam dotrzeć i samodzielnie wydobyć surowiec ze źródła.
drg_partial_payment=Przyjęto częściową zapłatę: __1__
drg_mule_destroyed_message=Twój Robot został zniszczony! __1__
drg_hacking_terminal_destroyed_message=Terminal hakerski został zniszczony! __1__
drg_driller_destroyed_message=Wiertnica została zniszczona! __1__
drg_mule_repaired=Robot naprawiony! __1__

drg_hacking_stage1_text=> Próba połączenia z kapsułą zrzutową...\n> Sygnał niestabilny. Utrzymuj zasilanie terminala i połączenie za pomocą zielonego kabla obwodowego.
drg_hacking_stage2_header=> Połączenie nawiązane.\n> AKTYWOWANO BLOKADĘ BEZPIECZEŃSTWA\n> Wprowadź sekwencję dostępu, aby kontynuować.
drg_hacking_stage3_text=> DOSTĘP PRZYZNANY\n> Deszyfrowanie zawartości kapsuły zrzutowej...
