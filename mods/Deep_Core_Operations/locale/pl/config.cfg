drg_class_scout_tooltip=Zwiadowca (Scout) jest niezwykle zwinny i dysponuje znaczną premią do prędkości ruchu, co pozwala mu z łatwością poruszać się po jaskiniach. Świetnie radzi sobie z szybką zmianą pozycji i dynamiczną walką przy użyciu lekkiej broni, takiej jak pistolet maszynowy (SMG) czy pistolet sygnałowy. Nie otrzymuje jednak premii do początkowej liczby punktów życia, a jego szybkość wydobycia i wytwarzania przedmiotów jest standardowa. Aby przetrwać, polega raczej na szybkości niż na dużej wytrzymałości.
drg_class_heavy_tooltip=Tragarz (Heavy) to filar pierwszej linii frontu, wyróżniający się największą początkową liczbą punktów życia oraz dodatkowymi miejscami w ekwipunku na amunicję. Choć na początku zmaga się z odczuwalnym spadkiem prędkości ruchu i wydobycia – wynikającym z noszenia potężnego pancerza i ciężkiego uzbrojenia (takiego jak Minigun czy Hand Cannon) – z czasem staje się niepowstrzymaną siłą. Potrafi utrzymywać kilka tarcz energetycznych jednocześnie, co czyni go jedyną klasą zdolną do przyjmowania na siebie bezpośrednich trafień od Dreadnoughtów.
drg_class_engineer_tooltip=Inżynier (Engineer) to mistrz technologii Stacji Kosmicznej (Space Rig). Wyróżnia się najszybszym tempem wytwarzania przedmiotów i najefektywniejszym rozstawianiem wieżyczek (z najkrótszym czasem oczekiwania). Choć jego parametry fizyczne są przeciętne, jego użyteczność nie ma sobie równych – jako jedyny ma uprawnienia do korzystania z zaawansowanych technologii, takich jak ładunki sejsmiczne czy działo Tesli. W kilka sekund potrafi przekształcić dowolną pozycję w twierdzę.
drg_class_miner_tooltip=Górnik (Miner) to specjalista od wierceń, dysponujący potężną premią 60% do początkowej prędkości wydobycia. Jest stworzony do przekształcania otoczenia; dysponuje powiększonym ekwipunkiem i korzysta z wytrzymałych egzoszkieletów. Dzięki narzędziom do kontrolowania obszaru, takim jak miotacz ognia czy kapsuły z trucizną, z równą skutecznością toruje sobie drogę i eliminuje szkodniki. Stanowi fundament każdej operacji wydobywczej.

