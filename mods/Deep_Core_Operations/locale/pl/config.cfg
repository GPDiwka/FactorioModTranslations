[technology-description]
drg_tech_discover_promethium=Odkryj, jak badać promet, infiltrując [img=space-location/drg-biome-zombie]Zainfekowany obiekt. Ten terminal może być kluczem do poznania ukrytych współrzędnych źródła czystego prometu w pobliżu tej planety [img=space-location/drg_promethium_asteroids].
drg_laboratory_productivity=Zwiększa wydajność laboratoriów.
drg_platform_core_upgrade=Ulepsza główny rdzeń Stacji Kosmicznej (Space Rig), rozszerzając jej możliwości i odblokowując nowe technologie.
drg_miner_drill_equipment=Ręczne wiertło pozwala górnikom drążyć tunele w szybszym tempie, a podczas pracy automatycznie przenosi wydobyte rudy bezpośrednio do ekwipunku. Zużywa 1 [item=rocket-fuel].
drg_tech_beer_market=Odblokowuje sklep z piwem, umożliwiając zakup najlepszego trunku w galaktyce.
drg_flare_gun=Pistolet sygnałowy oświetla jaskinie; oświetleni wrogowie otrzymują o 10% większe obrażenia przy ataku.
drg_emergency_extraction=Umożliwia wezwanie kapsuły ewakuacyjnej w sytuacji awaryjnej. Usługa ta nie jest jednak darmowa – ewakuację awaryjną należy zamówić w terminalu misji przed wyruszeniem na akcję.
drg_fluid_mining=Umożliwia wykorzystanie płynów do wydobywania minerałów w razie potrzeby.
drg_freeze_chest=Spowalnia proces psucia się zapasów.
drg_seismic_charge=Potężny ładunek wybuchowy zadający obrażenia obszarowe i drążący tunele!
drg_molly_upgrade=Ulepsza robota transportowego, zwiększając jego odporność, punkty życia (HP) oraz pojemność ekwipunku. Każdy poziom podnosi również o 10% premię za zebrane rudy.
drg_clanker=Twój towarzysz walki w jaskiniach! Każdy poziom zwiększa jego punkty życia (HP), odporność, zadawane obrażenia oraz szybkość ataku.
drg_energy_receiver=Umożliwia odbiór energii z platformy Stacji Kosmicznej. Liczba jednoczesnych połączeń energetycznych zależy od opracowanych ulepszeń.
drg_energy_receiver_extra_links=Zwiększa liczbę jednoczesnych połączeń energetycznych. 
drg_tech_toxic_mask=Umożliwia budowę maski przeciwgazowej, która chroni użytkownika przed toksycznymi gazami. Niezbędne wyposażenie do przetrwania w toksycznych jaskiniach: [img=space-location/drg-biome-toxic]Żyły Toxfract, [img=space-location/drg-biome-gleba]Skupisko zielonych żył oraz [img=space-location/drg-biome-zombie]Zainfekowany obiekt.
drg_tech_license_lightning_rod=Umożliwia budowę piorunochronów.
drg_tech_unlock_biome_gleba=Odblokowuje [img=space-location/drg-biome-gleba]Skupisko zielonych żył do eksploracji.
drg_tech_unlock_biome_aquilo=Odblokowuje [img=space-location/drg-biome-aquilo]Krystaliczne kanały do ​​eksploracji.

drg_supply_capsule=Umożliwia załodze przebywającej pod ziemią wezwanie kapsuły ze sprzętem i zapasami ze Stacji Kosmicznej (Space Rig). Każdy poziom technologii zwiększa liczbę możliwych wezwań w trakcie misji.
drg_platform_linked_chest_2=Pozwala na budowę kolejnej skrzyni połączonej z platformą, służącej do transportu przedmiotów między platformą zewnętrzną a wnętrzem Stacji Kosmicznej.
drg_ship_fluid_storage=Umożliwia przechowywanie płynów na statku. Każdy poziom technologii zwiększa pojemność zbiorników o 50 tys. litrów.
drg_Mule_upgrade=Ulepszenie dla robota. Każdy poziom zwiększa jego punkty życia (HP), pojemność ładowni oraz rozmiar siatki ekwipunku.
drg_ship_resource_storage=Zwiększa przestrzeń magazynową na surowce na Stacji Kosmicznej. Każdy poziom technologii zwiększa pojemność magazynu.
drg_mule_fluid_collect=Umożliwia robotowi zbieranie płynów zgromadzonych w [entity=drg_mule_fluid_collector]. Po pomyślnym wydobyciu płyny są magazynowane wewnątrz Stacji Kosmicznej.
drg_orbital_fluid_uplink=Urządzenie to umożliwia przesyłanie płynów ([fluid=water][fluid=crude-oil][fluid=heavy-oil][fluid=ammoniacal-solution][fluid=lithium-brine][fluid=fluorine]) z jaskiń na Stację Kosmiczną za pośrednictwem łącza orbitalnego. Aby zapewnić ciągły przepływ, należy napełnić urządzenie wybranym płynem z jaskini. Po całkowitym napełnieniu trzeba zostawić je w jaskini. Jeśli misja zakończy się powodzeniem i uda się przeprowadzić wydobycie, urządzenie będzie pompować płyn na Stację Kosmiczną tak długo, jak pozostanie w danym regionie (biomie). Instalacja łącza wymaga wcześniejszego ukończenia misji „Wydobycie płynów” (Mine Liquids) w danym regionie planety. W jednej misji jaskiniowej dozwolone jest użycie tylko jednego urządzenia. Każdy poziom tej technologii zwiększa liczbę łączy, które można zainstalować w regionie, oraz zwiększa ilość pompowanego płynu.

drg_drill_cannon=Przenośna armata wiertnicza przeznaczona do nieprzyjaznych podziemnych środowisk. Po wyposażeniu wystrzeliwuje ładunki udarowe z obracającymi się końcówkami wiertła, zdolne szybko rozbijać skały i otwierać przejścia w głębokich jaskiniach. Niezbędny dla inżynierów, którzy muszą posuwać się naprzód pod presją i unikać uwięzienia.
drg_ship_floors_tech=Odblokowuje nowe piętro statku kosmicznego, na które można dostać się windą.

drg_ship_platform_camera=Zdolność statku: umożliwia aktywację kamery platformy, dzięki czemu możesz obserwować otoczenie na zewnątrz.
wdm-linked-chest=Umożliwia przenoszenie przedmiotów między pokładami statku.
drg_ship_pipe=Umożliwia przesyłanie płynów między pokładami Stacji Kosmicznej za pomocą połączonych rur. Każdy poziom zwiększa liczbę rur, które można umieścić na danym pokładzie.

drg_enemy_evolution_tracker=Umożliwia śledzenie ewolucji przeciwników. Informacje te są wyświetlane na panelu kontrolnym misji, dzięki czemu możesz obserwować, jak ewoluują wrogowie w danym regionie.
drg_contract_tasks=Umożliwia przyjmowanie kontraktów od Galactic Mining Company.
drg_tech_mule_containment_chamber=Miejsce dla robota 
drg_tech_mission_terminal=Odblokowuje śluzę desantową oraz terminal misji w bazie Space Rig, umożliwiając rozpoczynanie misji i desant do jaskiń.
drg_tech_heat_shield=Umożliwia podróżowanie do regionów planety o ekstremalnie wysokich temperaturach.

