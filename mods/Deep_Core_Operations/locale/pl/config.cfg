
drg_intro_message=Twoja załoga zbliżała się do rozbitego świata [img=drg_planet]Fracta Mantis C — planety, którą Deep Core Operations uznało za bogate źródło cennych surowców dla górnictwa kosmicznego. Podczas wchodzenia na orbitę stacja kosmiczna zderzyła się z jednym z ogromnych odłamków planety. Uszkodzenia były krytyczne. [img=item/thruster]Silniki manewrowe uległy zniszczeniu, a znaczne części konstrukcji zostały zdewastowane. Twoja załoga jest teraz uwięziona w niewielkim przedziale ładunkowym, odcięta od kluczowych systemów statku. Większość stacji leży w gruzach. \n Jedynym działającym urządzeniem jest mały terminal. Dzięki niemu odkrywasz, że wciąż możesz sterować zewnętrznymi ramionami mechanicznymi statku. Być może, obsługując je, zdołasz zebrać z orbity niezbędne surowce i rozpocząć naprawę najważniejszych uszkodzeń — na tyle, by odbudować funkcjonalne centrum dowodzenia. Uszkodzony, lecz zachowujący ciągłość kanał transportowy nadal łączy przestrzeń zewnętrzną z waszym przedziałem, umożliwiając przemieszczanie materiałów. Naciśnij [img=drg_elevator], aby wyjść na platformę zewnętrzną i przejąć kontrolę nad ramionami mechanicznymi.
drg_intro_message_2=Świetnie! Te ramiona okazały się niezwykle przydatne! Naprawiając [img=entity/drg_space_rig_terminal]terminal, możesz teraz zdalnie łączyć się z innymi uszkodzonymi i zablokowanymi sekcjami, przywracając je do stanu używalności przy użyciu wymaganych materiałów. Uzyskanie dostępu do tych obszarów i ich naprawa powinny być twoim priorytetem!\nTerminal zasila teraz również platformę zewnętrzną.
drg_intro_message_3=Nasz [entity=drg_mule_droid_1]MULE jest na miejscu, cały i zdrowy! Rewelacja! Wygląda na to, że operacja wydobywcza jednak ma szansę powodzenia.\nKierownictwo nigdy nie wysyła stacji kosmicznej na głęboką orbitę bez w pełni sprawnej jednostki MULE na pokładzie. Maszyny te stanowią trzon każdej ekspedycji górniczej — transportują minerały i zaopatrzenie oraz dbają o przetrwanie górników, gdy wszystko w podziemiach czyha na ich życie. Utrata choćby jednej z nich sparaliżowałaby całą operację. Po przywróceniu zasilania w uszkodzonym magazynie, MULE w końcu zareagował na sygnał nawiązania połączenia z terminalem. Jego systemy są stare, sfatygowane i pokryte pyłem – pamiątką po tym, co tu zaszło... ale wciąż działają. To nam wystarczy. Dzięki ponownemu uruchomieniu MULE możesz teraz sprawniej transportować surowce po całej stacji i przygotować się do zakrojonej na szeroką skalę eksploatacji złóż na planecie.
drg_intro_message_4=[entity=drg_mission_terminal]Terminal misji znów działa! Świetna robota. Dzięki przywróceniu łączności platforma może ponownie nawiązać synchronizację ze skanerami planetarnymi i satelitami nawigacyjnymi głębokiego wiercenia. W systemie pojawiają się już nowe zlecenia wydobywcze, a podziemne jaskinie są mapowane w czasie rzeczywistym. Co ważniejsze… [img=entity/drg_drop_pod]komora startowa kapsuły desantowej znów jest gotowa do użytku. Oznacza to, że możemy wreszcie wysyłać górników bezpośrednio do sieci podziemnych jaskiń, gdzie znajdują się najbogatsze złoża minerałów.\n Miejcie się jednak na baczności – automatyczne skany wykazują nietypową aktywność biologiczną głęboko pod powierzchnią. Jaskinie pozostawały nienaruszone przez zbyt długi czas, a to, co tam żyje, miało mnóstwo okazji, by się rozprzestrzenić. Mimo to Zarządowi zależy na tych minerałach, a my dysponujemy teraz środkami, by do nich dotrzeć.\nSieć misji działa. Kapsuła desantowa jest zatankowana. Jaskinie czekają.

