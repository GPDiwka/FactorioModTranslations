[item-description]
drg_antigen_gas_release=Tego nie da się wziąć do ręki. Iniektor uwalnia antygen bezpośrednio do powietrza w komorze gniazda – to tylko zapis potwierdzający podanie dawki.
drg_stabilized_infected_promethium=[color=#fd7979]ZAGROŻENIE – WCIĄŻ NIE NADAJE SIĘ DO RĘCZNEGO PRZENOSZENIA.[/color]\nKąpiel w kwasie związała infekcję na tyle, by rudę można było przetworzyć i wysłać, ale nie na tyle, by można było jej dotykać. Zabija przy kontakcie, tak samo jak surowa ruda.\nTransportuj ją taśmociągami, robotami lub przechowuj w skrzyniach. Nigdy nie bierz jej do rąk.
drg_infected_promethium=[color=#fd7979]ZAGROŻENIE – NIE DOTYKAĆ RĘKAMI.[/color]\nInfekcja wewnątrz tej rudy jest wciąż aktywna i reaguje na żywą tkankę przy kontakcie. Każdy, kto ją podniesie, ginie w ciągu kilku sekund, a to, co się w niej gnieździ, budzi się do życia.\nPrzenoś ją za pomocą taśmociągów, podajników lub robotów. Nigdy ręcznie.
drg_lost_contract=Ten fragment kontraktu pozwala na wykonanie zadania kontraktowego. Trzymaj przedmiot w kursorze i kliknij na zadanie kontraktowe, aby je ukończyć.
drg_beer_regen=Oficjalnie sklasyfikowane jako napój leczniczy. Nieoficjalnie – jako rozpuszczalnik przemysłowy. Stopniowo regeneruje zdrowie.
drg_beer_speed=Zawiera tyle stymulantów, że mogłoby napędzić kapsułę desantową. Poruszaj się szybciej i ucieknij przed większością swoich złych decyzji.
drg_beer_mining_bonus=Zamienia zwykłych górników w maniaków kruszenia skał. Zwiększa wydajność wydobycia rudy kilofem. Kop mniej – wydobywaj więcej.
drg_beer_no_pain=Ból to cenny sygnał ostrzegawczy. To piwo całkowicie go eliminuje. Zyskujesz zwiększoną odporność na obrażenia.
drg_beer_bonus_damage=Dla krasnoludów wierzących, że każdy problem można rozwiązać większą siłą ognia. Zwiększa obrażenia zadawane wrogom.
drg_beer_bonus_damage_no_pain=Zalecane przed walkami z bossami, awaryjną ewakuacją i ocenami pracowniczymi. Zwiększa zadawane obrażenia, jednocześnie redukując odczuwany ból.

drg_flare_gun=Pistolet sygnałowy oświetla jaskinie, a oświetleni wrogowie otrzymują o 10% większe obrażenia podczas ataku.
drg_mule_freezer=Po zamontowaniu w Mule spowalnia psucie się przedmiotów w jej ładowni.
drg_asteroid-collector=[color=#e597f0]Limit: dozwolona tylko jedna sztuka do momentu opracowania technologii [technology=rocket-silo].[/color]
