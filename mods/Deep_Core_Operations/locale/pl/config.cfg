[mod-setting-description]
drg-cave-events-visible=Czy modyfikatory misji mają być widoczne w terminalu? Wyłącz tę opcję, aby w każdej misji trafiać na nieznany teren; możesz go jednak odkryć za pomocą umiejętności skanowania, zdobywanej w misjach skanowania jaskiń.
drg-enable-ore-delivery=Po włączeniu tej opcji wydobyte surowce są dostarczane do Stacji Kosmicznej co minutę (w misjach wydobywczych).
drg-fast-start=Przejdź od razu do akcji, pomijając terminal wprowadzający do fabuły i zaczynając z kapsułą desantową gotową do startu.
drg-difficulty-level=Od 1 (łatwy) do 5 (trudny)
drg_reduce_bullet_cost=Zmniejsz koszt amunicji o 50%
drg-reduce-tech-cost=Zmniejsz koszt o 50% (dla szybszej rozgrywki)
drg_enable_classes_contracts=Dodaje 4 unikalne klasy postaci i kontrakty. Rozwijaj każdą klasę, zdobywając PD w systemie progresji wzorowanym na grach RPG.
drg-less-contracts=Zmniejsza liczbę technologii wymagających ukończenia kontraktów.
drg-xp-only-for-players-on-cave=Czy PD mają otrzymywać tylko gracze przebywający w jaskini? Jeśli opcja jest wyłączona, PD otrzyma cała załoga, nawet jeśli niektórzy jej członkowie czekają na platformie.


